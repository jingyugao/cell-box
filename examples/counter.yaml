apiVersion: cellbox.local/v1alpha1
kind: Cellbox
metadata:
  name: counter
  namespace: cell-box
spec:
  nodeName: replace-with-node-name # Set to the target node's kubernetes.io/hostname label.
  desiredState: Running
  startupTimeoutSeconds: 45
  container:
    name: server
    image: docker.io/library/cellbox-counter:dev
    imagePullPolicy: Never
    resources:
      requests:
        memory: 64Mi
      limits:
        memory: 256Mi
    ports:
      - containerPort: 8000
    readinessProbe:
      httpGet:
        path: /healthz
        port: 8000
      periodSeconds: 2
    livenessProbe:
      httpGet:
        path: /healthz
        port: 8000
      periodSeconds: 5
      failureThreshold: 6
  servicePorts:
    - name: http
      port: 8000
      targetPort: 8000
