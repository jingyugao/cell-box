components:
  parameters:
  requestBodies:
    LifecyclePrecondition:
      required: false
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              expectedGeneration:
                type: integer
                minimum: 1
                description: Checked when the request is accepted. Empty request bodies remain supported.
  responses:
    Error:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: 'Structured error: 400 invalid input, 401 unauthenticated, 403
        denied, 404 missing or not owned, 409 conflict/busy/stale generation, 410 expired result or operation, 422
        unsupported, 502 runtime failure, 504 timeout, or UNKNOWN_OUTCOME when an accepted operation has no confirmed result.'
  schemas:
    Template:
      additionalProperties: false
      description: Client-owned template family. Revisions contain immutable build configuration.
      properties:
        id:
          type: string
          pattern: '^tpl-[0-9a-f]+$'
        name:
          type: string
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9_-]{0,79}$'
          maxLength: 80
        description:
          type: string
          maxLength: 8192
        defaultWarmSlots:
          type: integer
          minimum: 0
          maximum: 1024
          description: Default warm slots for revisions created from this template. Zero disables prewarming.
        stableRevisionId:
          type: string
        generation:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, name, defaultWarmSlots, generation, createdAt, updatedAt]
      type: object
    TemplateRevision:
      additionalProperties: false
      description: Immutable built sandbox configuration, except description, status and warmSlots.
      properties:
        id: {type: string}
        templateId: {type: string}
        templateName: {type: string}
        userVersion: {type: string}
        revision: {type: integer, minimum: 1}
        version: {type: string, description: Display version, for example 1.01-r2.}
        description: {type: string}
        profileId: {type: string}
        baseImage: {type: string, description: Submitted base image reference.}
        resolvedBaseImage: {type: string, description: Base image reference resolved to its immutable digest.}
        image: {type: string, description: Final immutable image digest.}
        buildCommand: {type: string}
        runCommand: {type: string}
        platform: {type: string}
        cpu: {type: number, minimum: 0, description: Configured CPU limit; zero means no limit.}
        memoryMiB: {type: integer, minimum: 0, description: Configured memory limit in MiB; zero means no limit.}
        warmSlots: {type: integer, minimum: 0, maximum: 1024}
        status: {type: string, enum: [active, retired]}
        generation: {type: integer, minimum: 1}
        buildOperationId: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
      required: [id, templateId, templateName, userVersion, revision, version, profileId, baseImage, resolvedBaseImage, image, platform, cpu, memoryMiB, warmSlots, status, generation, buildOperationId, createdAt, updatedAt]
      type: object
    WarmPoolResources:
      type: object
      description: Configured Kubernetes requests and limits for allocated idle warm Pods, not measured usage.
      properties:
        cpuRequestMilli: {type: integer, format: int64}
        cpuLimitMilli: {type: integer, format: int64}
        memoryRequestBytes: {type: integer, format: int64}
        memoryLimitBytes: {type: integer, format: int64}
      required: [cpuRequestMilli, cpuLimitMilli, memoryRequestBytes, memoryLimitBytes]
    WarmPoolStatus:
      type: object
      description: Pool counters aggregate all compatible revisions attached to this pool and may repeat in each revision's status. Deduplicate by poolId when summarizing.
      properties:
        poolId: {type: string}
        requestedSlots: {type: integer, description: Sum of configured demand for compatible revisions in this pool.}
        allocatedSlots: {type: integer, description: Slots allocated under the node-wide controller capacity.}
        readySlots: {type: integer}
        preparingSlots: {type: integer}
        failedSlots:
          type: integer
          description: Current failed Pods plus failures cleaned by the controller in the last 15 seconds.
        resources: {$ref: '#/components/schemas/WarmPoolResources'}
        observedAt: {type: string, format: date-time}
        stale: {type: boolean}
      required: [poolId, requestedSlots, allocatedSlots, readySlots, preparingSlots, failedSlots, resources, observedAt, stale]
    RevisionWarmStatus:
      type: object
      properties:
        revisionId: {type: string}
        generation: {type: integer}
        observedGeneration: {type: integer}
        desiredSlots: {type: integer}
        syncStatus: {type: string, enum: [pending, applied, unsupported]}
        error: {type: string}
        observedAt: {type: string, format: date-time}
        stale: {type: boolean}
        pool:
          allOf:
          - {$ref: '#/components/schemas/WarmPoolStatus'}
          nullable: true
      required: [revisionId, generation, observedGeneration, desiredSlots, syncStatus, stale, pool]
    RevisionRuntimeStatus:
      type: object
      properties:
        revisionId: {type: string}
        sandboxCount: {type: integer, nullable: true}
        phases:
          type: object
          additionalProperties: {type: integer}
        observedAt: {type: string, format: date-time}
        stale: {type: boolean}
        error: {type: string}
        warmPool: {$ref: '#/components/schemas/RevisionWarmStatus'}
      required: [revisionId, sandboxCount, phases, stale, warmPool]
    TemplateRuntimeStatus:
      type: object
      properties:
        templateId: {type: string}
        revisions:
          type: array
          items: {$ref: '#/components/schemas/RevisionRuntimeStatus'}
      required: [templateId, revisions]
    Archive:
      additionalProperties: false
      properties:
        agent:
          $ref: '#/components/schemas/Identity'
        consistency:
          const: workspace-best-effort
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          type: string
        imageId:
          type: string
        manifestVersion:
          type: integer
          description: Archive manifest version used to validate the stored payload.
        portable:
          type: boolean
        profileId:
          type: string
        templateId:
          type: string
        revisionId:
          type: string
          description: Immutable template revision pinned to this Box.
        templateName:
          type: string
        templateVersion:
          type: string
        sha256:
          type: string
        size:
          type: integer
        sourceBoxId:
          type: string
      required:
      - id
      - sourceBoxId
      - templateId
      - revisionId
      - templateName
      - templateVersion
      - profileId
      - imageId
      - portable
      - agent
      - sha256
      - size
      - consistency
      - createdAt
      type: object
    Box:
      additionalProperties: false
      properties:
        capabilities:
          $ref: '#/components/schemas/Capabilities'
        createdAt:
          format: date-time
          type: string
        error:
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
          required:
          - code
          - message
          type: object
        generation:
          type: integer
        homeVolumeId:
          type: string
          description: Compatibility shorthand for the volume mounted at /home/agent; omitted when this Box has no HOME mount.
        mounts:
          type: array
          description: Explicit volume mounts attached to this box; when omitted on create, legacy behavior creates a dedicated /home/agent volume.
          items: {$ref: '#/components/schemas/Mount'}
        executionId:
          description: Current runtime execution identity when observed; omitted when unknown or unavailable.
          type: string
        id:
          type: string
          maxLength: 55
          pattern: '^[a-z0-9]([-a-z0-9]{0,53}[a-z0-9])?$'
        image:
          type: string
        imageId:
          type: string
        operationId:
          type: string
        ownerKey:
          type: string
        profileId:
          type: string
          description: Read-only resolved provenance from the pinned template.
        templateId:
          type: string
        revisionId:
          type: string
          description: Immutable template revision pinned to this Box.
        templateName:
          type: string
        templateVersion:
          type: string
        resourceVersion:
          type: integer
        observedAt:
          description: Time of the latest runtime observation. Omitted means no runtime observation has completed yet.
          format: date-time
          type: string
        phase:
          description: Runtime lifecycle phase. running does not imply guest readiness or health.
          enum:
          - creating
          - running
          - checkpointing
          - suspending
          - suspended
          - resuming
          - restoring
          - staged
          - deleting
          - deleted
          - failed
          type: string
        workspace:
          type: string
      required:
      - id
      - ownerKey
      - profileId
      - templateId
      - revisionId
      - templateName
      - templateVersion
      - phase
      - generation
      - resourceVersion
      - image
      - workspace
      - capabilities
      - createdAt
      type: object
    Mount:
      additionalProperties: false
      description: A persistent volume mounted at a fixed path in a Box. A volume may be referenced by multiple Boxes. Mount paths must be clean absolute directory paths other than / and cannot contain control characters. Duplicate, overlapping, or nested paths are not checked.
      properties:
        volumeId: {type: string, minLength: 1, maxLength: 55, pattern: '^[a-z0-9]([-a-z0-9]{0,53}[a-z0-9])?$'}
        mountPath:
          type: string
          minLength: 2
          description: Clean absolute directory path other than /; control characters are rejected.
        readOnly:
          type: boolean
          default: false
      required: [volumeId, mountPath]
      type: object
    Volume:
      additionalProperties: false
      description: Independently managed persistent volume. Its phase remains available while one or more Boxes reference it; delete is rejected while any non-deleted Box references it.
      properties:
        id: {type: string, maxLength: 55, pattern: '^[a-z0-9]([-a-z0-9]{0,53}[a-z0-9])?$'}
        ownerKey: {type: string}
        profileId: {type: string}
        nodeName: {type: string}
        phase:
          type: string
          enum: [creating, available, backing-up, deleting, deleted, failed]
        resourceVersion: {type: integer, format: int64, minimum: 0}
        createdAt: {type: string, format: date-time}
        operationId: {type: string}
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required: [id, ownerKey, profileId, nodeName, phase, resourceVersion, createdAt]
      type: object
    BackupPolicy:
      additionalProperties: false
      properties:
        engine: {type: string, enum: [restic]}
        scope: {type: string, enum: [volume]}
        keepLast: {type: integer, minimum: 1, maximum: 100, description: Configured retention count; defaults to three snapshots.}
        enabled: {type: boolean}
      required: [engine, scope, keepLast, enabled]
      type: object
    VolumeBackup:
      additionalProperties: false
      properties:
        id: {type: string, pattern: '^[0-9a-f]{64}$'}
        createdAt: {type: string, format: date-time}
        sizeBytes: {type: integer, format: int64, minimum: 0, description: Total logical snapshot size when available.}
        addedBytes: {type: integer, format: int64, minimum: 0, description: Bytes newly added to the deduplicated repository when available.}
        volumeId: {type: string}
        ownerKey: {type: string}
        profileId: {type: string}
      required: [id, createdAt, volumeId, ownerKey, profileId]
      type: object
    RestoreVolume:
      additionalProperties: false
      properties:
        sourceVolumeId: {type: string, minLength: 1, maxLength: 55, pattern: '^[a-z0-9]([-a-z0-9]{0,53}[a-z0-9])?$'}
        backupId: {type: string, pattern: '^[0-9a-f]{64}$'}
        ownerKey: {type: string, minLength: 1, maxLength: 256}
        id: {type: string, minLength: 1, maxLength: 55, pattern: '^[a-z0-9]([-a-z0-9]{0,53}[a-z0-9])?$'}
      required: [sourceVolumeId, backupId, ownerKey]
      type: object
    Capabilities:
      additionalProperties: false
      properties:
        archives:
          enum: [none, stopped-workspace]
          type: string
          description: Profile/runtime support for stopped workspace capture. Archive operations also require node archive support and configured object storage.
        exec:
          type: boolean
        files:
          type: boolean
        http:
          type: boolean
        protectedTools:
          type: boolean
        credentialBatch:
          type: boolean
          description: Kubernetes only. Docker reports false and returns UNSUPPORTED_CAPABILITY for credential writes.
        internalServices:
          type: boolean
          description: Direct HTTP/WebSocket service proxy support.
        rootDebug:
          type: boolean
          description: Admitted tools run as debug UID/GID zero and can read agent-owned private workspace files without permission changes.
        sharedDirectory:
          type: boolean
          description: A profile-owned shared directory is mounted read-only at /var/lib/cellbox/shared.
        mountedToolRuntime:
          type: boolean
          description: The admitted image's protected runner supports mounted tool-runtime descriptors with root debug access.
        mountedDebugHome:
          type: boolean
          description: An admitted HOME runner uses the profile's managed runtime/debug-homes directory mounted read-write at /home/debug.
        persistentHome:
          type: boolean
          description: The provider mounts an independent HOME volume at /home/agent. A Box deletion detaches and retains the volume, including legacy per-Box HOME promoted in place; delete the Volume explicitly to remove its data.
        pty:
          type: boolean
        reconnectExec:
          type: boolean
        suspend:
          enum:
          - none
          - same-node-checkpoint
          type: string
        websocket:
          type: boolean
      required:
      - exec
      - files
      - http
      - websocket
      - pty
      - reconnectExec
      - suspend
      - archives
      - protectedTools
      type: object
    CreateBox:
      additionalProperties: false
      oneOf:
      - required: [templateId]
      - required: [revisionId]
      properties:
        staged:
          type: boolean
          default: false
          description: Kubernetes only. Start guest control and hold the workload until explicit activation; Docker returns UNSUPPORTED_CAPABILITY.
        id:
          type: string
          minLength: 1
          maxLength: 55
          pattern: '^[a-z0-9]([-a-z0-9]{0,53}[a-z0-9])?$'
          description: Optional caller-selected box ID. IDs use lowercase DNS-label syntax and are unique across clients for their full lifetime, including after purge; duplicate IDs return 409 CONFLICT.
        homeVolumeId:
          type: string
          minLength: 1
          maxLength: 55
          pattern: '^[a-z0-9]([-a-z0-9]{0,53}[a-z0-9])?$'
          description: Existing available persistent HOME volume to mount. Must belong to the same client and owner and be on a compatible node. A volume may be mounted by multiple Boxes. Docker profiles return UNSUPPORTED_CAPABILITY. Omit for a Kubernetes box to create its own retained HOME volume.
        mounts:
          type: array
          description: Complete volume mount list. A non-empty mounts list and homeVolumeId are mutually exclusive; when both are supplied the request returns 400. When supplied, Cellbox does not add an implicit /home/agent mount. Each volume must be available, belong to the same client and owner, and be compatible with the target node and guest identity. A volume may be referenced by multiple Boxes. Paths must be clean absolute directories other than / with no control characters. Duplicate or nested paths are not checked. Docker profiles return UNSUPPORTED_CAPABILITY. Omit to create a dedicated /home/agent volume. Empty-array behavior is unspecified; omit the field when requesting legacy behavior.
          items: {$ref: '#/components/schemas/Mount'}
        ownerKey:
          maxLength: 256
          minLength: 1
          type: string
        templateId:
          type: string
          minLength: 1
        revisionId:
          type: string
          minLength: 1
      description: Choose exactly one of templateId (resolves current stable revision at admission) or revisionId (pins an explicit revision). Caller-selected box IDs use lowercase DNS-label syntax and are unique across clients for their full lifetime, including after purge; duplicate IDs return 409 CONFLICT.
      required: [ownerKey]
      type: object
    Error:
      additionalProperties: false
      properties:
        error:
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
          required:
          - code
          - message
          type: object
      required:
      - error
      type: object
    ExecRequest:
      additionalProperties: false
      properties:
        argv:
          description: First argument must be an absolute executable path. Shell syntax
            requires explicit /bin/sh -c when available.
          items:
            type: string
          maxItems: 128
          minItems: 1
          type: array
        cwd:
          description: Relative workspace directory; defaults to workspace root.
          type: string
        env:
          additionalProperties:
            type: string
          type: object
        expectedGeneration:
          minimum: 1
          type: integer
        timeoutMs:
          default: 30000
          maximum: 300000
          minimum: 1
          type: integer
      required:
      - argv
      - expectedGeneration
      type: object
    ExecResult:
      additionalProperties: false
      properties:
        exitCode:
          type: integer
        stderr:
          type: string
        stdout:
          type: string
        truncated:
          type: boolean
      required:
      - stdout
      - stderr
      - exitCode
      type: object
    Execution:
      additionalProperties: false
      properties:
        boxId:
          type: string
        id:
          type: string
        operationId:
          type: string
        result:
          $ref: '#/components/schemas/ExecResult'
        state:
          enum:
          - running
          - exited
          - unknown
          type: string
      required:
      - id
      - boxId
      - operationId
      - state
      type: object
    FileEntry:
      additionalProperties: false
      properties:
        directory:
          type: boolean
        name:
          type: string
        size:
          type: integer
      required:
      - name
      - directory
      - size
      type: object
    Identity:
      additionalProperties: false
      properties:
        gid:
          type: integer
        uid:
          type: integer
      required:
      - uid
      - gid
      type: object
    Operation:
      description: An accepted runtime operation or a template build. Interrupted work after restart is reported failed with UNKNOWN_OUTCOME and is not rerun.
      oneOf:
      - $ref: '#/components/schemas/RuntimeOperation'
      - $ref: '#/components/schemas/TemplateBuildOperation'
    RuntimeOperation:
      additionalProperties: false
      properties:
        id: {type: string}
        kind: {type: string}
        targetId: {type: string}
        status: {type: string}
        version: {type: integer}
        createdAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
        result:
          type: object
          additionalProperties: {type: string}
        box:
          $ref: '#/components/schemas/Box'
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required: [id, kind, targetId, status, version, createdAt]
      type: object
    TemplateBuildOperation:
      additionalProperties: false
      properties:
        id: {type: string}
        kind: {type: string, const: template-build}
        targetId: {type: string}
        status: {type: string, enum: [queued, running, cancelling, succeeded, failed, cancelled]}
        stage: {type: string}
        version: {type: integer}
        input:
          type: object
          additionalProperties: true
          description: Submitted build request. buildCommand may contain sensitive values and is returned verbatim.
        createdAt: {type: string, format: date-time}
        startedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        result:
          type: object
          additionalProperties: {type: string}
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required: [id, kind, targetId, status, stage, version, input, createdAt, updatedAt]
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        code: {type: string}
        message: {type: string}
      required: [code, message]
      type: object
    Profile:
      additionalProperties: false
      properties:
        agent:
          $ref: '#/components/schemas/Identity'
        behavior:
          enum:
          - normal
          - resumable
          type: string
        capabilities:
          $ref: '#/components/schemas/Capabilities'
        cpu:
          minimum: 0
          description: Configured CPU limit; zero means no limit.
          type: number
        id:
          type: string
        image:
          type: string
        kind:
          enum:
          - docker-normal
          - k8s-resumable
          type: string
        memoryMiB:
          minimum: 0
          description: Configured memory limit in MiB; zero means no limit.
          type: integer
        provider:
          enum:
          - docker
          - resumable-k8s-pod
          type: string
        runtime:
          enum:
          - docker
          - k8s
          type: string
        workspace:
          type: string
      required:
      - id
      - provider
      - runtime
      - behavior
      - kind
      - image
      - workspace
      - agent
      - cpu
      - memoryMiB
      - capabilities
      type: object
    RestoreBox:
      additionalProperties: false
      oneOf:
      - required: [templateId]
      - required: [revisionId]
      description: Restore the archive into a new empty staged Kubernetes sandbox using its template or revision image and runtime configuration. The caller provisions credentials and explicitly activates it. A failed restore candidate is terminal and should be destroyed. Restore always creates a new HOME volume; homeVolumeId and mounts are not accepted. Docker returns UNSUPPORTED_CAPABILITY.
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 55
          pattern: '^[a-z0-9]([-a-z0-9]{0,53}[a-z0-9])?$'
          description: Optional caller-selected box ID. IDs are unique across clients for their full lifetime, including after purge; duplicate IDs return 409 CONFLICT.
        archiveId:
          type: string
        acceptImageChange:
          type: boolean
          default: false
          description: Allow a portable archive to restore into a revision with a different image identity. Restore still requires a compatible guest agent identity.
        ownerKey:
          maxLength: 256
          minLength: 1
          type: string
        templateId:
          type: string
          minLength: 1
        revisionId:
          type: string
          minLength: 1
      required: [ownerKey, archiveId]
      type: object
    ToolRequest:
      additionalProperties: false
      properties:
        args:
          items:
            type: string
          type: array
        timeoutMs:
          default: 30000
          maximum: 300000
          minimum: 1
          type: integer
      required: []
      type: object
    get:
info:
  description: Internal-network sandbox infrastructure. Control and service APIs require
    no token or browser authorization. X-Cellbox-Client-ID optionally selects a data
    namespace, not an authenticated identity; the default is config.clientId, or internal.
    Single-writer durable state; interrupted operations are not automatically replayed.
  title: Cellbox REST API
  version: 0.1.0
openapi: 3.1.0
paths:
  /healthz:
    get:
      operationId: health
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  status:
                    type: string
                required:
                - status
                type: object
          description: Success
        default:
          $ref: '#/components/responses/Error'
      security: []
      summary: Service process health
  /v1/archives:
    get:
      operationId: listArchives
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Archive'
                type: array
          description: Success
        default:
          $ref: '#/components/responses/Error'
      summary: List archives independently of box lifecycle
  /v1/archives/{id}:
    delete:
      operationId: deleteArchive
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Success
        default:
          $ref: '#/components/responses/Error'
      summary: Delete an archive not used by an active restore
    get:
      operationId: getArchive
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Archive'
          description: Success
        default:
          $ref: '#/components/responses/Error'
      summary: Get owned archive metadata
  /v1/archives/{id}/content:
    get:
      operationId: downloadArchive
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/gzip:
              schema:
                format: binary
                type: string
          description: Success
        default:
          $ref: '#/components/responses/Error'
      summary: Download an integrity-checked gzip tar
  /v1/boxes:
    get:
      operationId: listBoxes
      description: |
        Lists all owned resources directly with namespace-scoped Kubernetes LIST,
        using managed/client labels and inventory annotations. No lifecycle phase
        is filtered: creating, checkpointing, suspending, suspended, restoring,
        failed, and deleting resources are all returned. Running executions are
        checked against a batch Pod LIST without per-box GET or ledger enumeration.
        With observation=resource, trusts CR lifecycle state without reading Pods.
        This mode is for display-only listings that accept eventual consistency.
        Requests have a ten-second deadline; source errors fail the entire list.
      parameters:
      - in: query
        name: observation
        description: Omit for runtime verification; resource reads only CR lifecycle state.
        required: false
        schema:
          type: string
          enum: [resource]
      - in: query
        name: id
        description: Repeat to filter by multiple owned box IDs. Any missing or unowned ID returns 404.
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
        explode: true
      - in: query
        name: templateId
        schema: {type: string}
      - in: query
        name: revisionId
        schema: {type: string}
      - in: query
        name: phase
        schema: {type: string}
      - in: query
        name: limit
        schema: {type: integer, minimum: 1, maximum: 500}
      - in: query
        name: offset
        schema: {type: integer, minimum: 0}
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Box'
                type: array
          description: Success
        default:
          $ref: '#/components/responses/Error'
      summary: List all owned boxes directly from Kubernetes
    post:
      operationId: createBox
      description: A caller-selected ID uses lowercase DNS-label syntax and is permanently reserved across clients, including after purge. A duplicate ID returns 409 CONFLICT.
      parameters:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBox'
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
          description: Success
        "409":
          description: The box ID is already in use or the requested volume cannot be attached.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "400":
          description: homeVolumeId and a non-empty mounts list were both supplied, or a mount path is invalid.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        default:
          $ref: '#/components/responses/Error'
      summary: Create a box asynchronously
  /v1/backup-policy:
    get:
      operationId: getBackupPolicy
      summary: Get the independent-volume backup policy
      description: Reports the configured backup engine, scope, retention count, and whether backup is enabled. The default retention is the latest three snapshots; the count is configurable between 1 and 100.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackupPolicy'}
        default:
          $ref: '#/components/responses/Error'
  /v1/volumes:
    get:
      operationId: listVolumes
      summary: List persistent volumes in the client namespace
      description: Returns volume records, including creating, available while mounted, deleting, deleted, and failed states.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Volume'}
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createVolume
      summary: Create a persistent volume asynchronously
      description: A supplied ID uses lowercase DNS-label syntax and is reserved permanently across clients. Any ID already used for a Volume returns 409 CONFLICT, including deleted IDs. Omitted IDs are generated by Cellbox.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ownerKey, profileId]
              properties:
                id: {type: string, minLength: 1, maxLength: 55, pattern: '^[a-z0-9]([-a-z0-9]{0,53}[a-z0-9])?$'}
                ownerKey: {type: string, minLength: 1, maxLength: 256}
                profileId: {type: string, minLength: 1}
      responses:
        "202":
          description: Volume creation operation accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
        "409":
          description: The volume ID has already been used by any client on this server.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        default:
          $ref: '#/components/responses/Error'
  /v1/volumes/{id}:
    parameters:
    - in: path
      name: id
      required: true
      schema: {type: string, maxLength: 55, pattern: '^[a-z0-9]([-a-z0-9]{0,53}[a-z0-9])?$'}
    get:
      operationId: getVolume
      summary: Get a persistent volume
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Volume'}
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteVolume
      summary: Delete a persistent volume and its data asynchronously
      description: Deletion returns 409 CONFLICT while any Box whose phase is not deleted references the volume, including suspended Boxes. The volume remains available while referenced. Deletion is explicit; deleting a Box does not delete its volume.
      responses:
        "202":
          description: Volume deletion operation accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
        "409":
          description: At least one non-deleted Box references the volume.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        default:
          $ref: '#/components/responses/Error'
  /v1/volumes/{id}/backups:
    parameters:
    - in: path
      name: id
      required: true
      schema: {type: string, maxLength: 55, pattern: '^[a-z0-9]([-a-z0-9]{0,53}[a-z0-9])?$'}
    get:
      operationId: listVolumeBackups
      summary: List retained backups for an independent Volume
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/VolumeBackup'}
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createVolumeBackup
      summary: Back up a stopped independent Volume asynchronously
      description: Reads the independent Volume directly without creating or restoring a Sandbox. Every Box referencing the Volume must be stopped and detached. Restic deduplicates data in the configured object-storage repository and the server policy retains the configured number of latest snapshots (three by default). If the snapshot succeeds but pruning fails, the successful operation result includes retentionError. The request body may be empty or an empty object.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "202":
          description: Volume backup operation accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
        default:
          $ref: '#/components/responses/Error'
  /v1/volumes/{id}/backups/{backupId}:
    parameters:
    - in: path
      name: id
      required: true
      schema: {type: string, maxLength: 55, pattern: '^[a-z0-9]([-a-z0-9]{0,53}[a-z0-9])?$'}
    - in: path
      name: backupId
      required: true
      schema: {type: string, pattern: '^[0-9a-f]{64}$'}
    get:
      operationId: getVolumeBackup
      summary: Get one retained Volume backup
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VolumeBackup'}
        default:
          $ref: '#/components/responses/Error'
  /v1/volumes:restore:
    post:
      operationId: restoreVolume
      summary: Restore a snapshot into a new independent Volume asynchronously
      description: Always creates a new Volume and never creates a Sandbox. The source Volume may already be deleted; its retained backup remains restorable. The new Volume uses the supplied ownerKey and optionally supplied ID.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RestoreVolume'}
      responses:
        "202":
          description: Volume restore operation accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
        default:
          $ref: '#/components/responses/Error'
  /v1/checkpoints:
    get:
      operationId: listCheckpoints
      summary: List checkpoint resources directly from object storage
      description: |
        Lists client-owned checkpoint index records from local SQLite.
        Snapshot files stay on the assigned node. This endpoint does not query Kubernetes.
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Box'
                type: array
          description: Success
        default:
          $ref: '#/components/responses/Error'
  /v1/boxes/{id}:
    get:
      operationId: getBox
      description: |
        Observes runtime lifecycle metadata without guest health checks. Provider
        read errors fail the request without marking the box failed. Concurrent
        box changes trigger bounded observation retries or a conflict response.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Box'
          description: Success
        default:
          $ref: '#/components/responses/Error'
      summary: Inspect owned box and refresh provider lifecycle phase
  /v1/boxes/{id}/archives:
    post:
      description: Captures a suspended or failed Kubernetes sandbox with persistent HOME. Offline archives capture only the single writable HOME backing directory, so the workspace must be under /home/agent. If another volume overlays the workspace, any descendant of it, or any ancestor mount path, capture returns UNSUPPORTED_CAPABILITY because the HOME backing directory would omit that volume's data. These mount layouts remain valid for Box creation and runtime. Requires node archive support and configured object storage. Read-only HOME mounts are not archivable. The source is not resumed automatically. Excludes credentials outside workspace.
      operationId: captureArchive
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
          description: Success
        default:
          $ref: '#/components/responses/Error'
      summary: Capture a durable best-effort workspace archive
  /v1/boxes/{id}/credentials/{slot}:
    put:
      description: Kubernetes only; Docker returns UNSUPPORTED_CAPABILITY. Body is
        1..1048576 bytes. Slot must be referenced by an admitted tool. Secret never
        enters public box metadata or archive.
      operationId: putCredential
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: path
        name: slot
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/octet-stream:
            schema:
              format: binary
              maxLength: 1048576
              type: string
        required: true
      responses:
        "204":
          description: Success
        default:
          $ref: '#/components/responses/Error'
      summary: Install an admitted debug credential slot
  /v1/boxes/{id}/credentials:
    put:
      summary: Install admitted credential slots in one generation-fenced request
      description: A 204 response acknowledges all writes against the requested generation. A failed request may have applied some slots; the API provides no atomicity or idempotency guarantee, so callers must decide how to handle an uncertain result. Values are base64 strings, each decoding to 1..1048576 bytes, at most 2097152 bytes total. Docker returns UNSUPPORTED_CAPABILITY.
      operationId: writeCredentialBatch
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedGeneration, slots]
              properties:
                expectedGeneration:
                  type: integer
                  minimum: 1
                slots:
                  type: object
                  minProperties: 1
                  maxProperties: 32
                  propertyNames:
                    pattern: '^[A-Za-z][A-Za-z0-9_]{0,63}$'
                  additionalProperties:
                    type: string
                    contentEncoding: base64
      responses:
        "204":
          description: All slots installed in the requested generation
        default:
          $ref: '#/components/responses/Error'
  /v1/boxes/{id}/services/{port}/{path}:
    get:
      summary: Connect an owning backend client to a box HTTP or WebSocket service
      description: Proxies HTTP and WebSocket traffic directly to the selected sandbox service. Application Authorization is forwarded separately from guest transport credentials. Other HTTP methods are also proxied.
      operationId: internalService
      parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - in: path
        name: port
        required: true
        schema: { type: integer, minimum: 1, maximum: 65535, not: { const: 40000 } }
      - in: path
        name: path
        required: true
        schema: { type: string }
        description: Service path, including nested segments; an empty path uses the trailing slash.
      responses:
        "101": { description: WebSocket upgraded }
        "200": { description: Application HTTP response }
        default:
          $ref: '#/components/responses/Error'
  /v1/boxes/{id}/execs:
    post:
      description: result.execId identifies the execution. Outcome may be unknown
        on interruption. Each submission is an independent operation. No PTY or stdin stream.
      operationId: createExec
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecRequest'
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
          description: Success
        default:
          $ref: '#/components/responses/Error'
      summary: Execute a bounded command as agent
  /v1/boxes/{id}/files:
    get:
      description: File reads stream original bytes and support byte ranges and conditional requests. No 16 MiB read limit; list=1 returns directory entries.
      operationId: readFiles
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - description: Workspace-relative path; traversal and symlink following are
          denied.
        in: query
        name: path
        required: true
        schema:
          type: string
      - in: query
        name: list
        schema:
          enum:
          - "1"
          type: string
      - in: header
        name: Range
        schema:
          type: string
      - in: header
        name: If-Range
        schema:
          type: string
      - in: header
        name: If-Modified-Since
        schema:
          type: string
      - in: header
        name: If-Unmodified-Since
        schema:
          type: string
      - in: header
        name: If-Match
        schema:
          type: string
      - in: header
        name: If-None-Match
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/FileEntry'
                type: array
            application/octet-stream:
              schema:
                format: binary
                type: string
          description: Success
        "206":
          description: Partial bytes; Content-Range identifies the range and full file size.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "304":
          description: File has not changed; no body.
        "412":
          description: File precondition failed.
        "416":
          description: Unsatisfiable byte range; Content-Range contains bytes */size.
        default:
          $ref: '#/components/responses/Error'
      summary: Read a workspace file or list a directory
    head:
      operationId: headFile
      summary: Inspect a workspace file without transferring its contents
      description: Returns Content-Length, Content-Type, Last-Modified and Accept-Ranges. Range is ignored.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: query
        name: path
        required: true
        schema:
          type: string
      - in: header
        name: If-Modified-Since
        schema:
          type: string
      responses:
        "200":
          description: File metadata in HTTP headers; no body.
        "304":
          description: File has not changed; no body.
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: writeFile
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - description: Workspace-relative path; traversal and symlink following are
          denied.
        in: query
        name: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/octet-stream:
            schema:
              format: binary
              type: string
        required: true
      responses:
        "204":
          description: Success
        default:
          $ref: '#/components/responses/Error'
      summary: Write workspace bytes with agent ownership
  /v1/boxes/{id}/tools/{tool}:
    post:
      description: Kubernetes only. Docker returns UNSUPPORTED_CAPABILITY. Arguments
        are validated against full-match patterns. Tool definitions are server profile
        configuration; arbitrary debug commands are forbidden. Tool execution may
        have side effects and has no idempotency or replay guarantee.
      operationId: runTool
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: path
        name: tool
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecResult'
          description: Success
        default:
          $ref: '#/components/responses/Error'
      summary: Run an immutable admitted tool as debug
  /v1/boxes/{id}:activate:
    post:
      requestBody:
        $ref: '#/components/requestBodies/LifecyclePrecondition'
      description: An active operation or command blocks lifecycle changes. Docker staged activation is unsupported.
      operationId: activateBox
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
          description: Success
        default:
          $ref: '#/components/responses/Error'
      summary: Start the product workload in a successfully restored candidate
  /v1/boxes/{id}:destroy:
    post:
      requestBody:
        $ref: '#/components/requestBodies/LifecyclePrecondition'
      description: An active operation or command blocks lifecycle changes.
      operationId: destroyBox
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
          description: Success
        default:
          $ref: '#/components/responses/Error'
      summary: Delete runtime while retaining its HOME volume and archives
  /v1/boxes/{id}:resume:
    post:
      requestBody:
        $ref: '#/components/requestBodies/LifecyclePrecondition'
      description: Accepts a resume operation for a suspended Kubernetes sandbox. The caller can query its operation ID; Cellbox does not replay interrupted work after restart.
      operationId: resumeBox
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
          description: Resume operation accepted.
        default:
          $ref: '#/components/responses/Error'
      summary: Restore a resumable Kubernetes checkpoint
  /v1/boxes/{id}:suspend:
    post:
      requestBody:
        $ref: '#/components/requestBodies/LifecyclePrecondition'
      description: An active operation or command blocks lifecycle changes. Docker suspend/resume is unsupported.
      operationId: suspendBox
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
          description: Success
        default:
          $ref: '#/components/responses/Error'
      summary: Checkpoint a resumable Kubernetes box on its node
  /v1/boxes:restore:
    post:
      description: Restore an archive into a new empty staged Kubernetes sandbox with a new HOME volume. homeVolumeId and mounts are not accepted. The caller provisions credentials and explicitly activates it. Failed restore candidates are terminal and should be destroyed. Docker returns UNSUPPORTED_CAPABILITY.
      operationId: restoreBox
      parameters:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreBox'
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
          description: Success
        "409":
          description: The requested box ID has already been used.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        default:
          $ref: '#/components/responses/Error'
      summary: Restore an archive into a new staged box
  /v1/execs/{id}:
    get:
      description: Completed output is retained for executionRetentionSeconds (default
        3600), then returns 410 RESULT_EXPIRED. After operation history is pruned the
        execution returns 404. Running or unknown executions are retained.
      operationId: getExec
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Execution'
          description: Success
        default:
          $ref: '#/components/responses/Error'
      summary: Get recorded execution output and status
  /v1/operations/{id}:
    get:
      operationId: getOperation
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: query
        name: waitMs
        description: Wait for completion notification for up to 10000ms. Disconnect does not cancel the operation.
        schema:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
          description: Success
        default:
          $ref: '#/components/responses/Error'
      summary: Get durable operation status
  /v1/operations:
    get:
      operationId: listOperations
      description: Lists catalog build operations from SQLite. Does not query Kubernetes.
      parameters:
      - in: query
        name: templateId
        schema: {type: string}
      - in: query
        name: status
        schema: {type: string, enum: [queued, running, cancelling, succeeded, failed, cancelled]}
      - in: query
        name: limit
        schema: {type: integer, minimum: 1, maximum: 500, default: 100}
      - in: query
        name: offset
        schema: {type: integer, minimum: 0, default: 0}
      responses:
        "200":
          description: Catalog build operations
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Operation'}
        default:
          $ref: '#/components/responses/Error'
      summary: List template build operations without Kubernetes access
  /v1/operations/{id}/logs:
    get:
      operationId: getOperationLogs
      parameters:
      - in: path
        name: id
        required: true
        schema: {type: string}
      - in: query
        name: offset
        schema: {type: integer, minimum: 0, default: 0}
      - in: query
        name: limit
        schema: {type: integer, minimum: 1, maximum: 1048576, default: 65536}
      responses:
        "200":
          description: A bounded slice of the operation log; no streaming or follow mode.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [text, nextOffset, eof]
                properties:
                  text: {type: string}
                  nextOffset: {type: integer}
                  eof: {type: boolean}
        default:
          $ref: '#/components/responses/Error'
      summary: Read a slice of operation logs
  /v1/operations/{id}:cancel:
    post:
      operationId: cancelOperation
      parameters:
      - in: path
        name: id
        required: true
        schema: {type: string}
      responses:
        "200":
          description: Cancellation requested or operation already finished.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
        default:
          $ref: '#/components/responses/Error'
      summary: Request cancellation of a cancellable build operation
  /v1/operations/{id}/events:
    get:
      description: SSE event snapshot uses operation version as id. Reconnection sends
        the latest snapshot, not event history. Disconnect does not cancel the operation.
      operationId: watchOperation
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: Success
        default:
          $ref: '#/components/responses/Error'
      summary: Stream operation snapshots
  /v1/profiles:
    get:
      operationId: listProfiles
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Profile'
                type: array
          description: Success
        default:
          $ref: '#/components/responses/Error'
      summary: List configured profiles without authentication
  /v1/templates:
    get:
      operationId: listTemplates
      summary: List template families from SQLite without Kubernetes access
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Template'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createTemplate
      summary: Create a template family
      description: Creates metadata in SQLite; does not query Kubernetes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  pattern: '^[a-zA-Z0-9][a-zA-Z0-9_-]{0,79}$'
                  maxLength: 80
                description:
                  type: string
                  maxLength: 8192
                defaultWarmSlots:
                  type: integer
                  minimum: 0
                  maximum: 1024
                  default: 1
      responses:
        "201":
          description: Template created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        default:
          $ref: '#/components/responses/Error'
  /v1/templates/{id}:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
    get:
      operationId: getTemplate
      summary: Get a template family from SQLite
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateTemplate
      summary: Update template metadata, default warm target, or stable revision
      description: Metadata only; does not query Kubernetes. expectedGeneration prevents lost updates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedGeneration]
              properties:
                expectedGeneration: {type: integer, minimum: 1}
                description: {type: string, maxLength: 8192}
                defaultWarmSlots: {type: integer, minimum: 0, maximum: 1024}
                stableRevisionId:
                  type: string
                  description: Set to an empty string to clear the stable revision.
      responses:
        "200":
          description: Updated template family
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Template'}
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteTemplate
      summary: Delete an empty template family
      description: Deletes only when it has no revisions or queued/running/cancelling builds; no Kubernetes reference check is performed.
      responses:
        "204":
          description: Template deleted
        default:
          $ref: '#/components/responses/Error'
  /v1/templates/{id}/revisions:
    get:
      operationId: listTemplateRevisions
      description: Lists persisted revisions. Does not query Kubernetes or report runtime use counts.
      parameters:
      - in: path
        name: id
        required: true
        schema: {type: string}
      - in: query
        name: userVersion
        schema: {type: string}
      responses:
        "200":
          description: Revisions ordered by creation time
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/TemplateRevision'}
        default:
          $ref: '#/components/responses/Error'
      summary: List template revisions
    post:
      operationId: buildTemplateRevision
      description: Queues a BuildKit operation using a resolved immutable base image. The build command executes inside the image build, and runCommand is applied when creating a sandbox. Each submission creates an independent build operation. No Kubernetes APIs are queried by this endpoint.
      parameters:
      - in: path
        name: id
        required: true
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [userVersion, baseImage, profileId]
              properties:
                userVersion: {type: string, minLength: 1, maxLength: 80}
                baseImage: {type: string, minLength: 1}
                profileId: {type: string, minLength: 1}
                buildCommand: {type: string, maxLength: 65536}
                runCommand: {type: string, maxLength: 65536, description: One literal docker run command parsed using the existing image run-command contract.}
                platform: {type: string}
                warmSlots: {type: integer, minimum: 0, maximum: 1024}
      responses:
        "202":
          description: Build operation queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
        default:
          $ref: '#/components/responses/Error'
      summary: Build and register a new template revision
  /v1/template-revisions/{id}:
    parameters:
    - in: path
      name: id
      required: true
      schema: {type: string}
    get:
      operationId: getTemplateRevision
      summary: Get a template revision from SQLite without Kubernetes access
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TemplateRevision'}
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateTemplateRevision
      summary: Update revision description, status, or persisted warm target
      description: warmSlots changes the desired warm-pool target; background synchronization publishes changes and retries failures. expectedGeneration is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedGeneration]
              properties:
                expectedGeneration: {type: integer, minimum: 1}
                description: {type: string, maxLength: 8192}
                status: {type: string, enum: [active, retired]}
                warmSlots: {type: integer, minimum: 0, maximum: 1024}
      responses:
        "200":
          description: Updated revision metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TemplateRevision'}
        default:
          $ref: '#/components/responses/Error'
  /v1/template-revisions/{id}/warm-pool:
    get:
      operationId: getRevisionWarmPool
      summary: Get the latest observed warm-pool status
      description: |
        Desired revision configuration is read from SQLite and the latest controller
        observation held by the provider is returned. This request does not query
        Kubernetes. Compatible revisions can share a pool. observedAt and stale
        describe the runtime observation; pool is null when no pool is associated.
        Resource values are configured requests/limits, not measured usage. Do not
        sum resources across revisions without deduplicating by poolId.
      parameters:
      - in: path
        name: id
        required: true
        schema: {type: string}
      responses:
        "200":
          description: Latest warm-pool observation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RevisionWarmStatus'}
        default:
          $ref: '#/components/responses/Error'
  /v1/templates/{id}/runtime:
    get:
      operationId: getTemplateRuntime
      summary: Get current sandbox usage and observed warm-pool status for template revisions
      description: |
        Sandbox usage is read for this request from the Kubernetes resource inventory
        (without listing Pods), or from SQLite for Docker. Warm-pool status comes from
        the latest provider-held controller observation; desired configuration is
        read from SQLite. On inventory failure sandboxCount is null and stale is true.
        Check observedAt and stale before using either observation.
      parameters:
      - in: path
        name: id
        required: true
        schema: {type: string}
      responses:
        "200":
          description: Current inventory result and latest warm-pool observation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TemplateRuntimeStatus'}
        default:
          $ref: '#/components/responses/Error'
security: []
servers:
- description: Local default; use TLS for remote deployment
  url: http://127.0.0.1:8090
