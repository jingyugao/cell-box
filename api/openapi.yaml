  /v1/boxes/{id}:rebuild:
    post:
      description: Explicitly cold-start a failed same-node Box using its existing validated persistent HOME. Preserves Box identity and latest disk contents, discards checkpoint state, and never restores an archive. Missing or invalid HOME stops the operation. Active operations, executions and leases block rebuilding.
      operationId: rebuildBox
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
          description: Success
        default:
          $ref: '#/components/responses/Error'
      summary: Rebuild a failed Box from its persistent HOME
  /v1/boxes/{id}:resume:
    post:
      description: An active operation, service request, or unexpired usage lease
        blocks lifecycle changes. Docker suspend/resume is unsupported. Reconcile
        never reruns an interrupted exec or resumes a failed archive restore.
        Resume completion confirms the runtime is running and the Guest has been
        unquiesced. Guest health checks run asynchronously and report diagnostics
        without delaying completion or changing the box lifecycle phase.
      operationId: resumeBox
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
          description: Success
        default:
          $ref: '#/components/responses/Error'
