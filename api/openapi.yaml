          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
          description: Success
        default:
          $ref: '#/components/responses/Error'
      summary: Start the product workload in a successfully restored candidate
  /v1/boxes/{id}:destroy:
    post:
      description: An active operation, service request, or unexpired usage lease
