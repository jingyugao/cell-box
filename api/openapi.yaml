components:
  parameters:
    IdempotencyKey:
      description: Scoped by client, action and target. Reuse identical input to retrieve
        original operation, including after restart. Completed operation details are
        retained for operationRetentionSeconds (default 86400). After history expires,
        the key remains reserved and returns 410 OPERATION_EXPIRED without executing
        the request again. Running or unknown executions are not expired.
      in: header
      name: Idempotency-Key
      required: true
      schema:
        maxLength: 200
        minLength: 1
        type: string
  responses:
    Error:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: 'Structured error: 400 invalid input, 401 unauthenticated, 403
        denied, 404 missing or not owned, 409 conflict/busy/stale generation, 410 expired result or operation, 422
        unsupported, 502 runtime failure, 504 timeout.'
  schemas:
    Archive:
      additionalProperties: false
      properties:
        agent:
          $ref: '#/components/schemas/Identity'
        consistency:
          const: workspace-best-effort
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          type: string
        imageId:
          type: string
        importedImageId:
          description: Imported image required by default when restoring this archive.
          type: string
        preparedImage:
          description: Prepared image reference captured independently of the source box.
          type: string
        manifestVersion:
          description: Version 1 includes image dependencies independently of the source box.
          type: integer
        portable:
          type: boolean
        profileId:
          type: string
        sha256:
          type: string
        size:
          type: integer
        sourceBoxId:
          type: string
      required:
      - id
      - sourceBoxId
      - profileId
      - imageId
      - portable
      - agent
      - sha256
      - size
      - consistency
      - createdAt
      type: object
    Box:
      additionalProperties: false
      properties:
        capabilities:
          $ref: '#/components/schemas/Capabilities'
        createdAt:
          format: date-time
          type: string
        error:
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
          required:
          - code
          - message
          type: object
        generation:
          type: integer
        id:
          type: string
        image:
          type: string
        imageId:
          type: string
        operationId:
          type: string
        ownerKey:
          type: string
        profileId:
          type: string
        resourceVersion:
          type: integer
        phase:
          description: Runtime lifecycle phase. running does not imply guest readiness or health.
          enum:
          - creating
          - running
          - freezing
          - frozen
          - unfreezing
          - checkpointing
          - suspending
          - suspended
          - resuming
          - rebuilding
          - restoring
          - staged
          - deleting
          - deleted
          - failed
          type: string
        workspace:
          type: string
        importedImageId:
          type: string
      required:
      - id
      - ownerKey
      - profileId
      - phase
      - generation
      - resourceVersion
      - image
      - workspace
      - capabilities
      - createdAt
      type: object
    Capabilities:
      additionalProperties: false
      properties:
        archives:
          const: workspace-best-effort
          type: string
        exec:
          type: boolean
        files:
          type: boolean
        freeze:
          type: boolean
        http:
          type: boolean
        protectedTools:
          type: boolean
        credentialBatch:
          type: boolean
          description: The API accepts generation-fenced batch credential writes. Older Guest images may require the single-slot endpoint.
        internalServices:
          type: boolean
          description: Clients can connect to HTTP/WebSocket services without creating browser routes or grants.
        rootDebug:
          type: boolean
          description: Admitted tools run as debug UID/GID zero and can read agent-owned private workspace files without permission changes.
        sharedDirectory:
          type: boolean
          description: A profile-owned shared directory is mounted read-only at /var/lib/cellbox/shared.
        mountedToolRuntime:
          type: boolean
          description: The admitted image's protected runner supports mounted tool-runtime descriptors with root debug access.
        mountedDebugHome:
          type: boolean
          description: An admitted HOME runner uses the profile's managed runtime/debug-homes directory mounted read-write at /home/debug.
        persistentHome:
          type: boolean
          description: The provider preserves this Box's initially empty /home/agent directory across same-node suspend/resume. HOME data is separate from checkpoint objects and is removed when the Box is deleted.
        pty:
          type: boolean
        reconnectExec:
          type: boolean
        suspend:
          enum:
          - none
          - same-node-checkpoint
          type: string
        websocket:
          type: boolean
      required:
      - exec
      - files
      - http
      - websocket
      - pty
      - reconnectExec
      - freeze
      - suspend
      - archives
      - protectedTools
      type: object
    CreateBox:
      additionalProperties: false
      properties:
        staged:
          type: boolean
          default: false
          description: Start guest control and hold the workload until explicit activation.
        ownerKey:
          maxLength: 256
          minLength: 1
          type: string
        profileId:
          type: string
        importedImageId:
          type: string
          description: ID of a successful import owned by this client. Omit to use the profile image.
      required:
      - profileId
      - ownerKey
      type: object
    Error:
      additionalProperties: false
      properties:
        error:
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
          required:
          - code
          - message
          type: object
      required:
      - error
      type: object
    ExecRequest:
      additionalProperties: false
      properties:
        argv:
          description: First argument must be an absolute executable path. Shell syntax
            requires explicit /bin/sh -c when available.
          items:
            type: string
          maxItems: 128
          minItems: 1
          type: array
        cwd:
          description: Relative workspace directory; defaults to workspace root.
          type: string
        env:
          additionalProperties:
            type: string
          type: object
        expectedGeneration:
          minimum: 1
          type: integer
        timeoutMs:
          default: 30000
          maximum: 300000
          minimum: 1
          type: integer
      required:
      - argv
      - expectedGeneration
      type: object
    ExecResult:
      additionalProperties: false
      properties:
        exitCode:
          type: integer
        stderr:
          type: string
        stdout:
          type: string
        truncated:
          type: boolean
      required:
      - stdout
      - stderr
      - exitCode
      type: object
    Execution:
      additionalProperties: false
      properties:
        boxId:
          type: string
        id:
          type: string
        operationId:
          type: string
        result:
          $ref: '#/components/schemas/ExecResult'
        state:
          enum:
          - running
          - exited
          - unknown
          type: string
      required:
      - id
      - boxId
      - operationId
      - state
      type: object
    FileEntry:
      additionalProperties: false
      properties:
        directory:
          type: boolean
        name:
          type: string
        size:
          type: integer
      required:
      - name
      - directory
      - size
      type: object
    Identity:
      additionalProperties: false
      properties:
        gid:
          type: integer
        uid:
          type: integer
      required:
      - uid
      - gid
      type: object
    Lease:
      additionalProperties: false
      properties:
        boxId:
          type: string
        expiresAt:
          format: date-time
          type: string
        id:
          type: string
        purpose:
          type: string
      required:
      - id
      - boxId
      - purpose
      - expiresAt
      type: object
    LeaseInput:
      additionalProperties: false
      properties:
        purpose:
          maxLength: 256
          type: string
        ttlSeconds:
          default: 60
          maximum: 3600
          minimum: 1
          type: integer
      required: []
      type: object
    Operation:
      additionalProperties: false
      properties:
        createdAt:
          format: date-time
          type: string
        error:
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
          required:
          - code
          - message
          type: object
        finishedAt:
          format: date-time
          type: string
        id:
          type: string
        kind:
          type: string
        result:
          additionalProperties:
            type: string
          type: object
        status:
          enum:
          - queued
          - running
          - succeeded
          - failed
          type: string
        targetId:
          type: string
        version:
          type: integer
      required:
      - id
      - kind
      - targetId
      - status
      - version
      - createdAt
      type: object
    Profile:
      additionalProperties: false
      properties:
        agent:
          $ref: '#/components/schemas/Identity'
        behavior:
          enum:
          - normal
          - resumable
          type: string
        capabilities:
          $ref: '#/components/schemas/Capabilities'
        cpu:
          exclusiveMinimum: 0
          type: number
        id:
          type: string
        image:
          type: string
        kind:
          enum:
          - docker-normal
          - k8s-resumable
          type: string
        memoryMiB:
          minimum: 1
          type: integer
        provider:
          enum:
          - docker
          - resumable-k8s-pod
          type: string
        runtime:
          enum:
          - docker
          - k8s
          type: string
        workspace:
          type: string
      required:
      - id
      - provider
      - runtime
      - behavior
      - kind
      - image
      - workspace
      - agent
      - cpu
      - memoryMiB
      - capabilities
      type: object
    RestoreBox:
      additionalProperties: false
      properties:
        archiveId:
          type: string
        ownerKey:
          maxLength: 256
          minLength: 1
          type: string
        profileId:
          type: string
        importedImageId:
          type: string
          description: ID of a successful import owned by this client. Archive restore
            reuses the source imported image when omitted, unless acceptImageChange is
            true, in which case the target profile image is used.
        acceptImageChange:
          type: boolean
          description: Explicitly allow a validated portable workspace archive to restore into a different immutable image. Agent UID/GID must still match.
      required:
      - profileId
      - ownerKey
      - archiveId
      type: object
    Route:
      additionalProperties: false
      description: Process-local preview route; recreate it after API restart.
      properties:
        boxId:
          type: string
        id:
          type: string
        port:
          type: integer
        url:
          format: uri
          type: string
      required:
      - id
      - boxId
      - port
      - url
      type: object
    RouteInput:
      additionalProperties: false
      properties:
        boxId:
          type: string
        port:
          maximum: 65535
          minimum: 1
          not:
            const: 40000
          type: integer
      required:
      - boxId
      - port
      type: object
    ToolRequest:
      additionalProperties: false
      properties:
        args:
          items:
            type: string
          type: array
        timeoutMs:
          default: 30000
          maximum: 300000
          minimum: 1
          type: integer
      required: []
      type: object
    ImportedImage:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        source:
          type: string
        resolvedSource:
          type: string
        image:
          type: string
        platform:
          type: string
        workingDir:
          type: string
        buildCommand:
          type: string
          description: Shell command executed during image preparation, when provided.
        key:
          type: string
        command:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        env:
          type: object
          additionalProperties:
            type: string
        ports:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 65535
        createdAt:
          type: string
          format: date-time
        deleting:
          type: boolean
      required:
      - id
      - source
      - resolvedSource
      - image
      - platform
      - workingDir
      - key
      - command
      - warnings
      - env
      - ports
      - createdAt
      type: object
    ImageUsage:
      additionalProperties: false
      properties:
        deletable:
          type: boolean
        blockers:
          type: array
          items:
            type: string
        manifestShared:
          type: boolean
      required:
      - deletable
      - blockers
      - manifestShared
      type: object
    ImportImage:
      type: object
      additionalProperties: false
      required:
      - url
      properties:
        url:
          type: string
          description: 'Docker pull reference: repository:tag or repository@sha256:digest.
            HTTP download URLs are not supported.'
        runCommand:
          type: string
          maxLength: 65536
          description: One literal docker run command. Supports env, workdir, entrypoint
            and TCP publish metadata. No shell expansion or host mounts.
        buildCommand:
          type: string
          maxLength: 65536
          description: Optional shell script executed as root inside BuildKit using
            /bin/sh -c before Cellbox guest injection. Uses the source image ENV and
            WorkingDir; the source must provide /bin/sh. Included in image cache identity.
        platform:
          type: string
          enum:
          - linux/amd64
          default: linux/amd64
        registryAuth:
          type: object
          additionalProperties: false
          required:
          - username
          - password
          properties:
            username:
              type: string
            password:
              type: string
              writeOnly: true
info:
  description: Internal-network sandbox infrastructure. Control and service APIs require
    no token or browser authorization. X-Cellbox-Client-ID optionally selects a data
    and idempotency namespace, not an authenticated identity; the default is config.clientId,
    or internal. Single-writer durable state; no automatic command replay or implicit wake.
  title: Cellbox REST API
  version: 0.1.0
openapi: 3.1.0
paths:
  /healthz:
    get:
      operationId: health
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  status:
                    type: string
                required:
                - status
                type: object
          description: Success
        default:
          $ref: '#/components/responses/Error'
      security: []
      summary: Service process health
  /v1/archives:
    get:
      operationId: listArchives
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Archive'
                type: array
          description: Success
        default:
          $ref: '#/components/responses/Error'
      summary: List archives independently of box lifecycle
  /v1/archives/{id}:
    delete:
      operationId: deleteArchive
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Success
        default:
          $ref: '#/components/responses/Error'
      summary: Delete an archive not used by an active restore
    get:
      operationId: getArchive
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Archive'
          description: Success
        default:
          $ref: '#/components/responses/Error'
      summary: Get owned archive metadata
  /v1/archives/{id}/content:
    get:
      operationId: downloadArchive
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/gzip:
              schema:
                format: binary
                type: string
          description: Success
        default:
          $ref: '#/components/responses/Error'
      summary: Download an integrity-checked gzip tar
  /v1/boxes:
    get:
      operationId: listBoxes
      description: |
        Lists all owned resources directly with namespace-scoped Kubernetes LIST,
        using managed/client labels and inventory annotations. No lifecycle phase
        is filtered: creating, checkpointing, suspending, suspended, restoring,
        failed, and deleting resources are all returned. Running executions are
        checked against a batch Pod LIST without per-box GET or ledger enumeration.
        With observation=resource, trusts CR lifecycle state without reading Pods.
        This mode is for display-only listings that accept eventual consistency.
        Requests have a ten-second deadline; source errors fail the entire list.
      parameters:
      - in: query
        name: observation
        description: Omit for runtime verification; resource reads only CR lifecycle state.
        required: false
        schema:
          type: string
          enum: [resource]
      - in: query
        name: id
        description: Repeat to filter by multiple owned box IDs. Any missing or unowned ID returns 404.
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
        explode: true
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Box'
                type: array
          description: Success
        default:
          $ref: '#/components/responses/Error'
      summary: List all owned boxes directly from Kubernetes
    post:
      operationId: createBox
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBox'
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
          description: Success
        default:
          $ref: '#/components/responses/Error'
      summary: Create a box asynchronously
  /v1/checkpoints:
    get:
      operationId: listCheckpoints
      summary: List checkpoint resources directly from object storage
      description: |
        Lists checkpoint metadata objects and reads each record directly from OSS.
        Records are scoped to the selected client namespace. No lifecycle phase is
        filtered: checkpointing, suspending, suspended, resuming, failed, and deleting
        records remain visible until the underlying resource is physically removed.
        Suspended records require a committed snapshot and released source Pod.
        No Kubernetes or service-ledger enumeration is performed. Concurrent object
        deletion between LIST and GET is skipped; storage errors fail the entire list.
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Box'
                type: array
          description: Success
        default:
          $ref: '#/components/responses/Error'
  /v1/images:
    post:
      operationId: buildImage
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [baseImage]
              additionalProperties: false
              properties:
                baseImage:
                  description: Immutable repository@sha256:digest base image.
                  type: string
                platform:
                  description: Optional Linux platform such as linux/amd64.
                  type: string
                manifest:
                  description: Optional JSON installed at /opt/product/manifest.json.
                  type: string
                product:
                  description: Optional plain tar archive of regular product files.
                  type: string
                  format: binary
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
          description: Build queued; the operation result contains image, digest, tag and key.
        default:
          $ref: '#/components/responses/Error'
      summary: Build and publish a Cellbox image with BuildKit
    get:
      operationId: listImportedImages
      description: |
        Lists image metadata objects in OSS and reads them for each request.
        The mutation cache is not consulted. Records are scoped to the authenticated
        client, deletion tombstones are omitted, and storage errors fail the list.
      summary: List successfully imported images owned by this client
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImportedImage'
        default:
          $ref: '#/components/responses/Error'
  /v1/boxes/{id}:
    get:
      operationId: getBox
      description: |
        Observes runtime lifecycle metadata without guest health checks. Provider
        read errors fail the request without marking the box failed. Concurrent
        box changes trigger bounded observation retries or a conflict response.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Box'
          description: Success
        default:
          $ref: '#/components/responses/Error'
      summary: Inspect owned box and refresh provider lifecycle phase
  /v1/boxes/{id}/archives:
    post:
      description: result.archiveId identifies the capture; source runtime is not
        destroyed or suspended. Excludes debug credentials and files outside workspace.
      operationId: captureArchive
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
          description: Success
        default:
          $ref: '#/components/responses/Error'
      summary: Capture a durable best-effort workspace archive
  /v1/boxes/{id}/credentials/{slot}:
    put:
      description: 1..1048576 bytes. Slot must be referenced by an admitted tool. Secret
        never enters public box metadata or archive.
      operationId: putCredential
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: path
        name: slot
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/octet-stream:
            schema:
              format: binary
              maxLength: 1048576
              type: string
        required: true
      responses:
        "204":
          description: Success
        default:
          $ref: '#/components/responses/Error'
      summary: Install an admitted debug credential slot
  /v1/boxes/{id}/credentials:
    put:
      summary: Install admitted credential slots in one generation-fenced request
      description: A 204 response acknowledges all writes against the requested generation. A failed batch can have applied some slots; retry the complete batch. Values are base64 strings, each decoding to 1..1048576 bytes, at most 2097152 bytes total.
      operationId: writeCredentialBatch
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedGeneration, slots]
              properties:
                expectedGeneration:
                  type: integer
                  minimum: 1
                slots:
                  type: object
                  minProperties: 1
                  maxProperties: 32
                  propertyNames:
                    pattern: '^[A-Za-z][A-Za-z0-9_]{0,63}$'
                  additionalProperties:
                    type: string
                    contentEncoding: base64
      responses:
        "204":
          description: All slots installed in the requested generation
        default:
          $ref: '#/components/responses/Error'
  /v1/boxes/{id}/services/{port}/{path}:
    get:
      summary: Connect an owning backend client to a box HTTP or WebSocket service
      description: Requires no authentication. Rejects the private control port and holds a lifecycle fence for the live connection. No route, grant, lease or ledger write is required. Application Authorization is forwarded separately from guest transport credentials. Other HTTP methods are also proxied.
      operationId: internalService
      parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - in: path
        name: port
        required: true
        schema: { type: integer, minimum: 1, maximum: 65535, not: { const: 40000 } }
      - in: path
        name: path
        required: true
        schema: { type: string }
        description: Service path, including nested segments; an empty path uses the trailing slash.
      responses:
        "101": { description: WebSocket upgraded }
        "200": { description: Application HTTP response }
        default:
          $ref: '#/components/responses/Error'
  /v1/boxes/{id}/execs:
    post:
      description: result.execId identifies the execution. Outcome may be unknown
        on interruption; never automatically replay. No PTY or stdin stream.
      operationId: createExec
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecRequest'
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
          description: Success
        default:
          $ref: '#/components/responses/Error'
      summary: Execute a bounded command as agent
  /v1/boxes/{id}/files:
    get:
      description: File reads stream original bytes and support byte ranges and conditional requests. No 16 MiB read limit; list=1 returns directory entries.
      operationId: readFiles
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - description: Workspace-relative path; traversal and symlink following are
          denied.
        in: query
        name: path
        required: true
        schema:
          type: string
      - in: query
        name: list
        schema:
          enum:
          - "1"
          type: string
      - in: header
        name: Range
        schema:
          type: string
      - in: header
        name: If-Range
        schema:
          type: string
      - in: header
        name: If-Modified-Since
        schema:
          type: string
      - in: header
        name: If-Unmodified-Since
        schema:
          type: string
      - in: header
        name: If-Match
        schema:
          type: string
      - in: header
        name: If-None-Match
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/FileEntry'
                type: array
            application/octet-stream:
              schema:
                format: binary
                type: string
          description: Success
        "206":
          description: Partial bytes; Content-Range identifies the range and full file size.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "304":
          description: File has not changed; no body.
        "412":
          description: File precondition failed.
        "416":
          description: Unsatisfiable byte range; Content-Range contains bytes */size.
        default:
          $ref: '#/components/responses/Error'
      summary: Read a workspace file or list a directory
    head:
      operationId: headFile
      summary: Inspect a workspace file without transferring its contents
      description: Returns Content-Length, Content-Type, Last-Modified and Accept-Ranges. Range is ignored.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: query
        name: path
        required: true
        schema:
          type: string
      - in: header
        name: If-Modified-Since
        schema:
          type: string
      responses:
        "200":
          description: File metadata in HTTP headers; no body.
        "304":
          description: File has not changed; no body.
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: writeFile
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - description: Workspace-relative path; traversal and symlink following are
          denied.
        in: query
        name: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/octet-stream:
            schema:
              format: binary
              type: string
        required: true
      responses:
        "204":
          description: Success
        default:
          $ref: '#/components/responses/Error'
      summary: Write workspace bytes with agent ownership
