{{- if .Values.gatewayAccess.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cellbox-gateway
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [cellbox.local]
    resources: [cellboxes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [services, pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cellbox-gateway
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.gatewayAccess.serviceAccountName }}
    namespace: {{ .Values.gatewayAccess.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cellbox-gateway
{{- end }}
