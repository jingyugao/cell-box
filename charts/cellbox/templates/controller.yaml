{{- if .Values.controller.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Values.controller.name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.controller.name }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: {{ .Values.controller.name }}
        app.kubernetes.io/part-of: cellbox
        app.kubernetes.io/component: controller
      annotations:
        checksum/object-storage: {{ include "cellbox.objectStorageConfig" . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.controller.serviceAccountName }}
      hostPID: true
      terminationGracePeriodSeconds: 60
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: controller
          image: {{ include "cellbox.image" (dict "root" . "image" .Values.controller.image) | quote }}
          imagePullPolicy: {{ .Values.controller.imagePullPolicy }}
          args:
            - --node=$(NODE_NAME)
            - --namespace={{ .Release.Namespace }}
            - --leader-election-namespace={{ .Release.Namespace }}
            - --object-storage-config=/etc/cellbox-storage/config.json
            - --host-mount-namespace
            - --cri-socket={{ .Values.controller.criSocket }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- if .Values.objectStorage.credentialsSecret }}
            - name: OSS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.objectStorage.credentialsSecret }}
                  key: {{ .Values.objectStorage.accessKeyKey }}
            - name: OSS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.objectStorage.credentialsSecret }}
                  key: {{ .Values.objectStorage.secretKeyKey }}
            {{- end }}
          securityContext:
            privileged: true
            runAsUser: 0
          volumeMounts:
            - name: object-storage
              mountPath: /etc/cellbox-storage
              readOnly: true
            - name: cri-directory
              mountPath: {{ .Values.controller.criDirectory }}
            - name: runsc-root
              mountPath: /run/containerd/runsc/k8s.io
            - name: snapshot-store
              mountPath: /var/lib/cellbox
            - name: host-binaries
              mountPath: /usr/local/bin
              readOnly: true
      volumes:
        - name: object-storage
          configMap:
            name: cellbox-object-storage
            defaultMode: 0444
        - name: cri-directory
          hostPath:
            path: {{ .Values.controller.criDirectory }}
            type: Directory
        - name: runsc-root
          hostPath:
            path: /run/containerd/runsc/k8s.io
            type: DirectoryOrCreate
        - name: snapshot-store
          hostPath:
            path: /var/lib/cellbox
            type: DirectoryOrCreate
        - name: host-binaries
          hostPath:
            path: /usr/local/bin
            type: DirectoryOrCreate
{{- end }}
