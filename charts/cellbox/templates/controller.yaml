{{- if .Values.controller.enabled }}
{{- $localMetadata := .Values.localMetadata | default dict }}
{{- $localMetadataEnabled := get $localMetadata "enabled" | default false }}
{{- $localMetadataInitialize := get $localMetadata "initialize" | default false }}
{{- $localMetadataNode := get $localMetadata "nodeName" | default "" | toString | trim }}
{{- $localMetadataHostPath := get $localMetadata "hostPath" | default "/var/lib/cellbox-metadata" | toString }}
{{- if and $localMetadataInitialize (not $localMetadataEnabled) }}{{- fail "localMetadata.initialize requires localMetadata.enabled" }}{{- end }}
{{- if $localMetadataEnabled }}
  {{- if not .Values.api.enabled }}{{- fail "localMetadata.enabled requires api.enabled" }}{{- end }}
  {{- if eq $localMetadataNode "" }}{{- fail "localMetadata.nodeName is required when localMetadata.enabled" }}{{- end }}
  {{- if or (not (hasPrefix "/" $localMetadataHostPath)) (eq $localMetadataHostPath "/") (hasSuffix "/" $localMetadataHostPath) (contains "//" $localMetadataHostPath) (regexMatch "(^|/)\\.{1,2}(/|$)" $localMetadataHostPath) }}{{- fail "localMetadata.hostPath must be a clean absolute path other than /" }}{{- end }}
  {{- $apiNodeSelector := .Values.api.nodeSelector | default dict }}
  {{- if and (hasKey $apiNodeSelector "kubernetes.io/hostname") (ne (get $apiNodeSelector "kubernetes.io/hostname" | toString) $localMetadataNode) }}{{- fail "api.nodeSelector kubernetes.io/hostname conflicts with localMetadata.nodeName" }}{{- end }}
  {{- $controllerNodeSelector := .Values.controller.nodeSelector | default dict }}
  {{- if and (hasKey $controllerNodeSelector "kubernetes.io/hostname") (ne (get $controllerNodeSelector "kubernetes.io/hostname" | toString) $localMetadataNode) }}{{- fail "controller.nodeSelector kubernetes.io/hostname conflicts with localMetadata.nodeName" }}{{- end }}
{{- end }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Values.controller.name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.controller.name }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: {{ .Values.controller.name }}
        app.kubernetes.io/part-of: cellbox
        app.kubernetes.io/component: controller
      annotations:
        checksum/object-storage: {{ include "cellbox.objectStorageConfig" . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.controller.serviceAccountName }}
      hostPID: true
      terminationGracePeriodSeconds: 60
      {{- if $localMetadataEnabled }}
      nodeSelector:
        {{- toYaml (mergeOverwrite (deepCopy (.Values.controller.nodeSelector | default dict)) (dict "kubernetes.io/hostname" $localMetadataNode)) | nindent 8 }}
      {{- else }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: controller
          image: {{ include "cellbox.image" (dict "root" . "image" .Values.controller.image) | quote }}
          imagePullPolicy: {{ .Values.controller.imagePullPolicy }}
          args:
            - --node=$(NODE_NAME)
            - --namespace={{ .Release.Namespace }}
            - --leader-election-namespace={{ .Release.Namespace }}
            - --object-storage-config=/etc/cellbox-storage/config.json
            - --warm-pool-size={{ if hasKey .Values.controller "warmPoolSize" }}{{ .Values.controller.warmPoolSize }}{{ else }}2{{ end }}
            - --host-mount-namespace
            - --cri-socket={{ .Values.controller.criSocket }}
            {{- if $localMetadataEnabled }}
            - --local-metadata-dir=/var/lib/cellbox-metadata
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- if .Values.objectStorage.credentialsSecret }}
            - name: OSS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.objectStorage.credentialsSecret }}
                  key: {{ .Values.objectStorage.accessKeyKey }}
            - name: OSS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.objectStorage.credentialsSecret }}
                  key: {{ .Values.objectStorage.secretKeyKey }}
            {{- end }}
            {{- with .Values.controller.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            privileged: true
            runAsUser: 0
          volumeMounts:
            - name: object-storage
              mountPath: /etc/cellbox-storage
              readOnly: true
            - name: cri-directory
              mountPath: {{ .Values.controller.criDirectory }}
            - name: runsc-root
              mountPath: /run/containerd/runsc/k8s.io
            - name: snapshot-store
              mountPath: /var/lib/cellbox
            {{- if $localMetadataEnabled }}
            - name: local-metadata
              mountPath: /var/lib/cellbox-metadata
            {{- end }}
            - name: host-binaries
              mountPath: /usr/local/bin
              readOnly: true
      volumes:
        - name: object-storage
          configMap:
            name: cellbox-object-storage
            defaultMode: 0444
        - name: cri-directory
          hostPath:
            path: {{ .Values.controller.criDirectory }}
            type: Directory
        - name: runsc-root
          hostPath:
            path: /run/containerd/runsc/k8s.io
            type: DirectoryOrCreate
        - name: snapshot-store
          hostPath:
            path: /var/lib/cellbox
            type: DirectoryOrCreate
        {{- if $localMetadataEnabled }}
        - name: local-metadata
          hostPath:
            path: {{ $localMetadataHostPath | quote }}
            type: DirectoryOrCreate
        {{- end }}
        - name: host-binaries
          hostPath:
            path: /usr/local/bin
            type: DirectoryOrCreate
{{- end }}
