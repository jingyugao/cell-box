apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Values.controller.name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.controller.name }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: {{ .Values.controller.name }}
    spec:
      serviceAccountName: {{ .Values.controller.serviceAccountName }}
      hostPID: true
      terminationGracePeriodSeconds: 60
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: install-runtime-adapter
          image: {{ .Values.controller.adapterImage | quote }}
          imagePullPolicy: {{ .Values.controller.imagePullPolicy }}
          command: [/bin/sh, /usr/local/bin/install-k8s-node.sh]
          securityContext:
            privileged: true
            runAsUser: 0
          volumeMounts:
            - name: host-root
              mountPath: /host
      containers:
        - name: controller
          image: {{ .Values.controller.image | quote }}
          imagePullPolicy: {{ .Values.controller.imagePullPolicy }}
          args:
            - --node=$(NODE_NAME)
            - --namespace={{ .Release.Namespace }}
            - --leader-election-namespace={{ .Release.Namespace }}
            - --host-mount-namespace
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
            runAsUser: 0
          volumeMounts:
            - name: cri-directory
              mountPath: {{ .Values.controller.criDirectory }}
            - name: runsc-root
              mountPath: /run/containerd/runsc/k8s.io
            - name: snapshot-store
              mountPath: /var/lib/cellbox
            - name: runsc-binary
              mountPath: /usr/local/bin/runsc
              readOnly: true
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory
        - name: cri-directory
          hostPath:
            path: {{ .Values.controller.criDirectory }}
            type: Directory
        - name: runsc-root
          hostPath:
            path: /run/containerd/runsc/k8s.io
            type: DirectoryOrCreate
        - name: snapshot-store
          hostPath:
            path: /var/lib/cellbox
            type: DirectoryOrCreate
        - name: runsc-binary
          hostPath:
            path: /usr/local/bin/runsc
            type: File
