{{- if .Values.api.enabled }}
{{- $existingClaim := lookup "v1" "PersistentVolumeClaim" .Values.api.namespace .Values.api.dataClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.api.dataClaim }}
  namespace: {{ .Values.api.namespace }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- if and $existingClaim $existingClaim.spec.volumeName }}
  volumeName: {{ $existingClaim.spec.volumeName }}
  {{- end }}
  {{- if .Values.api.storageClassName }}
  storageClassName: {{ .Values.api.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.api.storageSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cellbox-api
  namespace: {{ .Values.api.namespace }}
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cellbox-api
  template:
    metadata:
      labels:
        app: cellbox-api
    spec:
      serviceAccountName: cellbox-api
      automountServiceAccountToken: true
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-data-dir
          image: busybox:1.36
          command: [/bin/sh, -ec, 'chown 10001:10001 /var/lib/cellbox && chmod 0700 /var/lib/cellbox']
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [CHOWN, FOWNER]
          volumeMounts:
            - name: data
              mountPath: /var/lib/cellbox
      containers:
        - name: api
          image: {{ .Values.api.image | quote }}
          imagePullPolicy: {{ .Values.api.imagePullPolicy }}
          command: [/usr/local/bin/cellbox]
          args: [--config, /etc/cellbox/config.json]
          envFrom:
            - secretRef:
                name: {{ .Values.api.clientTokensSecret }}
          env:
            - name: OSS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.ossCredentialsSecret }}
                  key: OSS_ACCESS_KEY
            - name: OSS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.ossCredentialsSecret }}
                  key: OSS_SECRET_KEY
          ports:
            - name: http
              containerPort: 8090
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/cellbox
              readOnly: true
            - name: data
              mountPath: /var/lib/cellbox
            - name: temp
              mountPath: /tmp
      volumes:
        - name: config
          secret:
            secretName: {{ .Values.api.configSecret }}
            defaultMode: 0440
            items:
              - key: config.json
                path: config.json
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.api.dataClaim }}
        - name: temp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cellbox-api
  namespace: {{ .Values.api.namespace }}
spec:
  selector:
    app: cellbox-api
  ports:
    - name: http
      port: 8090
      targetPort: http
{{- end }}
