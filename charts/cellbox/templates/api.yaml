{{- if .Values.api.enabled }}
{{- $apiNamespace := include "cellbox.apiNamespace" . }}
{{- $storage := .Values.storage | default dict }}
{{- $storageHostPath := get $storage "hostPath" | default "/var/lib/cellbox-data" | toString | trim }}
{{- $storageClaim := get $storage "existingClaim" | default "" | toString | trim }}
{{- $dataDir := get (.Values.api.config | default dict) "dataDir" | default "/var/lib/cellbox-data" | toString | trim }}
{{- $controller := .Values.controller | default dict }}
{{- $nodeBase := get $controller "nodeBase" | default "/var/lib/cellbox" | toString | trim }}
{{- $runsc := get $controller "runsc" | default "/usr/local/bin/runsc" | toString | trim }}
{{- $runscRoot := get $controller "runscRoot" | default "/run/containerd/runsc/k8s.io" | toString | trim }}
{{- $shim := get $controller "shim" | default "/usr/local/bin/containerd-shim-runsc-v1" | toString | trim }}
{{- $runtimeClass := .Values.runtimeClass | default dict }}
{{- $runtimeClassName := get $runtimeClass "name" | default "runsc-recoverable" | toString | trim }}
{{- $runtimeHandler := get $runtimeClass "handler" | default "" | toString | trim }}
{{- if eq $runtimeHandler "" }}{{- $runtimeHandler = $runtimeClassName }}{{- end }}
{{- $serverNode := .Values.server.nodeName | default "" | toString | trim }}
{{- if eq $serverNode "" }}{{- fail "server.nodeName is required; the single server must be pinned to its runtime node" }}{{- end }}
{{- if ne $apiNamespace .Release.Namespace }}{{- fail "api.namespace must match the release namespace for the single-server runtime" }}{{- end }}
{{- range $selectorName, $selector := dict "api.nodeSelector" (.Values.api.nodeSelector | default dict) "controller.nodeSelector" (.Values.controller.nodeSelector | default dict) }}
  {{- if and (hasKey $selector "kubernetes.io/hostname") (ne (get $selector "kubernetes.io/hostname" | toString) $serverNode) }}{{- fail (printf "%s kubernetes.io/hostname conflicts with server.nodeName" $selectorName) }}{{- end }}
{{- end }}
{{- if ne $dataDir "/var/lib/cellbox-data" }}{{- fail "api.config.dataDir must be /var/lib/cellbox-data to use the configured persistent storage" }}{{- end }}
{{- range $pathName, $path := dict "controller.nodeBase" $nodeBase "controller.runsc" $runsc "controller.runscRoot" $runscRoot "controller.shim" $shim }}
  {{- if or (not (hasPrefix "/" $path)) (eq $path "/") (hasSuffix "/" $path) (contains "//" $path) (regexMatch "(^|/)\\.{1,2}(/|$)" $path) }}{{- fail (printf "%s must be a clean absolute path other than /" $pathName) }}{{- end }}
{{- end }}
{{- if or (eq $runtimeClassName "") (contains "/" $runtimeClassName) (contains " " $runtimeClassName) }}{{- fail "runtimeClass.name must be a non-empty RuntimeClass name" }}{{- end }}
{{- if or (eq $runtimeHandler "") (contains " " $runtimeHandler) }}{{- fail "runtimeClass.handler must be a non-empty CRI handler" }}{{- end }}
{{- if ne (int .Values.api.replicas) 1 }}{{- fail "api.replicas must be 1; the API has a single active Lease owner" }}{{- end }}
{{- if eq $storageClaim "" }}
  {{- if or (not (hasPrefix "/" $storageHostPath)) (eq $storageHostPath "/") (hasSuffix "/" $storageHostPath) (contains "//" $storageHostPath) (regexMatch "(^|/)\\.{1,2}(/|$)" $storageHostPath) }}{{- fail "storage.hostPath must be a clean absolute path other than /" }}{{- end }}
{{- end }}
{{- range $i, $profile := (.Values.api.config.profiles | default list) }}
  {{- if and (hasKey $profile "namespace") (ne (get $profile "namespace" | toString) $.Release.Namespace) }}{{- fail (printf "api.config.profiles[%d].namespace must match the release namespace" $i) }}{{- end }}
  {{- if and (hasKey $profile "nodeName") (ne (get $profile "nodeName" | toString) $serverNode) }}{{- fail (printf "api.config.profiles[%d].nodeName must match server.nodeName" $i) }}{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cellbox-server
  namespace: {{ $apiNamespace }}
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cellbox-server
  template:
    metadata:
      labels:
        app: cellbox-server
      annotations:
        checksum/object-storage: {{ include "cellbox.objectStorageConfig" . | sha256sum }}
        {{- if .Values.api.manageSecrets }}
        checksum/api-config: {{ toJson .Values.api.config | sha256sum }}
        {{- end }}
        {{- if .Values.buildkit.enabled }}
        checksum/buildkit-config: {{ include (print $.Template.BasePath "/buildkit-config.yaml") . | sha256sum }}
        {{- end }}
    spec:
      serviceAccountName: cellbox-server
      automountServiceAccountToken: true
      nodeSelector:
        {{- toYaml (mergeOverwrite (deepCopy (.Values.controller.nodeSelector | default dict)) (mergeOverwrite (deepCopy (.Values.api.nodeSelector | default dict)) (dict "kubernetes.io/hostname" $serverNode))) | nindent 8 }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      hostPID: true
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        {{- if .Values.buildkit.enabled }}
        supplementalGroups: [1000]
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.buildkit.enabled }}
      initContainers:
        - name: prepare-buildkit-dirs
          image: {{ include "cellbox.image" (dict "root" . "image" .Values.api.initImage) | quote }}
          # fsGroup leaves a setgid group outside RootlessKit's UID/GID mapping.
          # Overlayfs needs the cache directories owned by mapped IDs.
          command: [/bin/sh, -ec, 'chown 1000:1000 /run/cellbox-buildkit /home/user/.local/share/buildkit && chmod 0770 /run/cellbox-buildkit && chmod 0700 /home/user/.local/share/buildkit && chmod g-s /home/user/.local/share/buildkit']
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [CHOWN, FOWNER]
          volumeMounts:
            - name: buildkit-socket
              mountPath: /run/cellbox-buildkit
            - name: buildkit-cache
              mountPath: /home/user/.local/share/buildkit
      {{- end }}
      containers:
        - name: server
          image: {{ include "cellbox.image" (dict "root" . "image" .Values.server.image) | quote }}
          imagePullPolicy: {{ .Values.server.imagePullPolicy }}
          command: [/opt/cellbox/bin/cellbox-server]
          args:
            - --config
            - /etc/cellbox/config.json
            - --object-storage-config
            - /etc/cellbox-storage/config.json
            - --leader-election-namespace
            - {{ $apiNamespace }}
            - --node=$(NODE_NAME)
            - --namespace={{ .Release.Namespace }}
            - --warm-pool-size={{ if hasKey .Values.controller "warmPoolSize" }}{{ .Values.controller.warmPoolSize }}{{ else }}2{{ end }}
            - {{ printf "--runtime-class=%s" $runtimeClassName | quote }}
            - {{ printf "--runtime-handler=%s" $runtimeHandler | quote }}
            - {{ printf "--node-base=%s" $nodeBase | quote }}
            - {{ printf "--runsc=%s" $runsc | quote }}
            - {{ printf "--runsc-root=%s" $runscRoot | quote }}
            - {{ printf "--shim=%s" $shim | quote }}
            - --host-mount-namespace
            - --cri-socket={{ .Values.controller.criSocket }}
            {{- if .Values.buildkit.enabled }}
            - --buildkit-addr
            - unix:///run/cellbox-buildkit/buildkitd.sock
            - --image-repository
            - {{ required "buildkit.repository is required when enabled" .Values.buildkit.repository | quote }}
            - --guest-binary
            - /opt/cellbox/bin/cellbox-container-agent
            - --buildctl
            - /opt/cellbox/bin/buildctl
            {{- if and .Values.buildkit.registryHTTP .Values.buildkit.registryHost }}
            - --image-insecure-registry
            - {{ .Values.buildkit.registryHost | quote }}
            {{- end }}
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOME
              value: /tmp
            - name: PATH
              value: /host/usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            {{- with .Values.controller.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if and .Values.buildkit.enabled .Values.buildkit.registryCredentialsSecret }}
            - name: DOCKER_CONFIG
              value: /etc/cellbox-registry
            {{- end }}
            {{- if .Values.objectStorage.credentialsSecret }}
            - name: OSS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.objectStorage.credentialsSecret }}
                  key: {{ .Values.objectStorage.accessKeyKey }}
            - name: OSS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.objectStorage.credentialsSecret }}
                  key: {{ .Values.objectStorage.secretKeyKey }}
            {{- end }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8090
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 3
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          securityContext:
            privileged: true
            runAsUser: 0
          volumeMounts:
            - name: object-storage
              mountPath: /etc/cellbox-storage
              readOnly: true
            - name: config
              mountPath: /etc/cellbox
              readOnly: true
            - name: data
              mountPath: /var/lib/cellbox-data
            - name: temp
              mountPath: /tmp
            - name: cri-directory
              mountPath: {{ .Values.controller.criDirectory }}
            - name: runsc-root
              {{- if eq $runscRoot "/run/containerd/runsc/k8s.io" }}
              mountPath: /run/containerd/runsc/k8s.io
              {{- else }}
              mountPath: {{ $runscRoot | quote }}
              {{- end }}
            - name: snapshot-store
              {{- if eq $nodeBase "/var/lib/cellbox" }}
              mountPath: /var/lib/cellbox
              {{- else }}
              mountPath: {{ $nodeBase | quote }}
              {{- end }}
            {{- if eq $runsc "/usr/local/bin/runsc" }}
            - name: host-binaries
              # Preserve the original default mount while hashing and invoking
              # the host runsc binary at its absolute path.
              mountPath: /usr/local/bin
              readOnly: true
            {{- else }}
            - name: runsc-binary
              # Checkpoint hashes the selected runsc binary before nsenter runs
              # the same host path in the host mount namespace.
              mountPath: {{ $runsc | quote }}
              readOnly: true
            {{- end }}
            {{- if .Values.buildkit.enabled }}
            - name: buildkit-socket
              mountPath: /run/cellbox-buildkit
            {{- if .Values.buildkit.registryCredentialsSecret }}
            - name: registry-credentials
              mountPath: /etc/cellbox-registry
              readOnly: true
            {{- end }}
            {{- end }}
        {{- if .Values.buildkit.enabled }}
        - name: buildkit
          image: {{ include "cellbox.image" (dict "root" . "image" .Values.buildkit.image) | quote }}
          imagePullPolicy: {{ .Values.buildkit.imagePullPolicy }}
          {{- with .Values.buildkit.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - --addr=unix:///run/cellbox-buildkit/buildkitd.sock
            - --group=0
            - --oci-worker-no-process-sandbox
            - --config=/etc/buildkit/buildkitd.toml
          readinessProbe:
            exec:
              command: [buildctl, --addr, unix:///run/cellbox-buildkit/buildkitd.sock, debug, workers]
            periodSeconds: 10
          resources:
            requests:
              {{- toYaml .Values.buildkit.requests | nindent 14 }}
            {{- with .Values.buildkit.limits }}
            limits:
              {{- toYaml . | nindent 14 }}
            {{- end }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            seccompProfile:
              type: Unconfined
            appArmorProfile:
              type: Unconfined
          volumeMounts:
            - name: buildkit-socket
              mountPath: /run/cellbox-buildkit
            - name: buildkit-cache
              mountPath: /home/user/.local/share/buildkit
            - name: buildkit-config
              mountPath: /etc/buildkit
              readOnly: true
        {{- end }}
      volumes:
        - name: object-storage
          configMap:
            name: cellbox-object-storage
            defaultMode: 0444
        - name: config
          secret:
            secretName: {{ .Values.api.configSecret }}
            defaultMode: 0440
            items:
              - key: config.json
                path: config.json
        - name: data
          {{- if ne $storageClaim "" }}
          persistentVolumeClaim:
            claimName: {{ $storageClaim | quote }}
          {{- else }}
          hostPath:
            path: {{ $storageHostPath | quote }}
            type: DirectoryOrCreate
          {{- end }}
        - name: cri-directory
          hostPath:
            path: {{ .Values.controller.criDirectory }}
            type: Directory
        - name: runsc-root
          hostPath:
            {{- if eq $runscRoot "/run/containerd/runsc/k8s.io" }}
            path: /run/containerd/runsc/k8s.io
            {{- else }}
            path: {{ $runscRoot | quote }}
            {{- end }}
            type: DirectoryOrCreate
        - name: snapshot-store
          hostPath:
            {{- if eq $nodeBase "/var/lib/cellbox" }}
            path: /var/lib/cellbox
            {{- else }}
            path: {{ $nodeBase | quote }}
            {{- end }}
            type: DirectoryOrCreate
        {{- if eq $runsc "/usr/local/bin/runsc" }}
        - name: host-binaries
          hostPath:
            path: /usr/local/bin
            type: DirectoryOrCreate
        {{- else }}
        - name: runsc-binary
          hostPath:
            path: {{ $runsc | quote }}
            type: File
        {{- end }}
        - name: temp
          emptyDir:
            sizeLimit: {{ ternary "1Gi" "64Mi" .Values.buildkit.enabled }}
        {{- if .Values.buildkit.enabled }}
        {{- if .Values.buildkit.registryCredentialsSecret }}
        - name: registry-credentials
          secret:
            secretName: {{ .Values.buildkit.registryCredentialsSecret }}
            defaultMode: 0440
            items:
              - key: .dockerconfigjson
                path: config.json
        {{- end }}
        - name: buildkit-socket
          emptyDir: {}
        - name: buildkit-cache
          emptyDir:
            sizeLimit: {{ .Values.buildkit.cacheSize }}
        - name: buildkit-config
          configMap:
            name: cellbox-buildkit-config
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: cellbox-api
  namespace: {{ $apiNamespace }}
spec:
  selector:
    app: cellbox-server
  ports:
    - name: http
      port: 8090
      targetPort: http
{{- end }}
