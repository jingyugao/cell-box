{{- if .Values.api.enabled }}
{{- $apiNamespace := include "cellbox.apiNamespace" . }}
{{- $existingClaim := lookup "v1" "PersistentVolumeClaim" $apiNamespace .Values.api.dataClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.api.dataClaim }}
  namespace: {{ $apiNamespace }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- if and $existingClaim $existingClaim.spec.volumeName }}
  volumeName: {{ $existingClaim.spec.volumeName }}
  {{- end }}
  {{- if .Values.api.storageClassName }}
  storageClassName: {{ .Values.api.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.api.storageSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cellbox-api
  namespace: {{ $apiNamespace }}
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cellbox-api
  template:
    metadata:
      labels:
        app: cellbox-api
      {{- if or .Values.buildkit.enabled .Values.api.manageSecrets }}
      annotations:
        {{- if .Values.api.manageSecrets }}
        checksum/api-config: {{ toJson .Values.api.config | sha256sum }}
        checksum/client-tokens: {{ toJson .Values.api.clientTokens | sha256sum }}
        {{- end }}
        {{- if .Values.buildkit.enabled }}
        checksum/buildkit-config: {{ include (print $.Template.BasePath "/buildkit-config.yaml") . | sha256sum }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: cellbox-api
      automountServiceAccountToken: true
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        {{- if .Values.buildkit.enabled }}
        supplementalGroups: [1000]
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-data-dir
          image: {{ include "cellbox.image" (dict "root" . "image" .Values.api.initImage) | quote }}
          command: [/bin/sh, -ec, 'chown 10001:10001 /var/lib/cellbox && chmod 0700 /var/lib/cellbox']
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [CHOWN, FOWNER]
          volumeMounts:
            - name: data
              mountPath: /var/lib/cellbox
        {{- if .Values.buildkit.enabled }}
        - name: prepare-buildkit-dirs
          image: {{ include "cellbox.image" (dict "root" . "image" .Values.api.initImage) | quote }}
          # fsGroup leaves a setgid group outside RootlessKit's UID/GID mapping.
          # Overlayfs needs the cache directories owned by mapped IDs.
          command: [/bin/sh, -ec, 'chown 1000:1000 /run/cellbox-buildkit /home/user/.local/share/buildkit && chmod 0770 /run/cellbox-buildkit && chmod 0700 /home/user/.local/share/buildkit && chmod g-s /home/user/.local/share/buildkit']
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [CHOWN, FOWNER]
          volumeMounts:
            - name: buildkit-socket
              mountPath: /run/cellbox-buildkit
            - name: buildkit-cache
              mountPath: /home/user/.local/share/buildkit
        {{- end }}
      containers:
        - name: api
          image: {{ include "cellbox.image" (dict "root" . "image" .Values.api.image) | quote }}
          imagePullPolicy: {{ .Values.api.imagePullPolicy }}
          command: [/usr/local/bin/cellbox-api]
          args:
            - --config
            - /etc/cellbox/config.json
            {{- if .Values.buildkit.enabled }}
            - --buildkit-addr
            - unix:///run/cellbox-buildkit/buildkitd.sock
            - --image-repository
            - {{ required "buildkit.repository is required when enabled" .Values.buildkit.repository | quote }}
            - --guest-binary
            - /usr/local/bin/cellbox-container-agent
            - --buildctl
            - /usr/local/bin/buildctl
            {{- if and .Values.buildkit.registryHTTP .Values.buildkit.registryHost }}
            - --image-insecure-registry
            - {{ .Values.buildkit.registryHost | quote }}
            {{- end }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.api.clientTokensSecret }}
          env:
            - name: HOME
              value: /tmp
            {{- if and .Values.buildkit.enabled .Values.buildkit.registryCredentialsSecret }}
            - name: DOCKER_CONFIG
              value: /etc/cellbox-registry
            {{- end }}
            {{- if .Values.api.ossCredentialsSecret }}
            - name: OSS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.ossCredentialsSecret }}
                  key: OSS_ACCESS_KEY
            - name: OSS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.ossCredentialsSecret }}
                  key: OSS_SECRET_KEY
            {{- end }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8090
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/cellbox
              readOnly: true
            - name: data
              mountPath: /var/lib/cellbox
            - name: temp
              mountPath: /tmp
            {{- if .Values.buildkit.enabled }}
            - name: buildkit-socket
              mountPath: /run/cellbox-buildkit
            {{- if .Values.buildkit.registryCredentialsSecret }}
            - name: registry-credentials
              mountPath: /etc/cellbox-registry
              readOnly: true
            {{- end }}
            {{- end }}
        {{- if .Values.buildkit.enabled }}
        - name: buildkit
          image: {{ include "cellbox.image" (dict "root" . "image" .Values.buildkit.image) | quote }}
          imagePullPolicy: {{ .Values.buildkit.imagePullPolicy }}
          {{- with .Values.buildkit.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - --addr=unix:///run/cellbox-buildkit/buildkitd.sock
            - --group=0
            - --oci-worker-no-process-sandbox
            - --config=/etc/buildkit/buildkitd.toml
          readinessProbe:
            exec:
              command: [buildctl, --addr, unix:///run/cellbox-buildkit/buildkitd.sock, debug, workers]
            periodSeconds: 10
          resources:
            requests:
              {{- toYaml .Values.buildkit.requests | nindent 14 }}
            limits:
              {{- toYaml .Values.buildkit.limits | nindent 14 }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            seccompProfile:
              type: Unconfined
            appArmorProfile:
              type: Unconfined
          volumeMounts:
            - name: buildkit-socket
              mountPath: /run/cellbox-buildkit
            - name: buildkit-cache
              mountPath: /home/user/.local/share/buildkit
            - name: buildkit-config
              mountPath: /etc/buildkit
              readOnly: true
        {{- end }}
      volumes:
        - name: config
          secret:
            secretName: {{ .Values.api.configSecret }}
            defaultMode: 0440
            items:
              - key: config.json
                path: config.json
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.api.dataClaim }}
        - name: temp
          emptyDir:
            sizeLimit: {{ ternary "1Gi" "64Mi" .Values.buildkit.enabled }}
        {{- if .Values.buildkit.enabled }}
        {{- if .Values.buildkit.registryCredentialsSecret }}
        - name: registry-credentials
          secret:
            secretName: {{ .Values.buildkit.registryCredentialsSecret }}
            defaultMode: 0440
            items:
              - key: .dockerconfigjson
                path: config.json
        {{- end }}
        - name: buildkit-socket
          emptyDir: {}
        - name: buildkit-cache
          emptyDir:
            sizeLimit: {{ .Values.buildkit.cacheSize }}
        - name: buildkit-config
          configMap:
            name: cellbox-buildkit-config
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: cellbox-api
  namespace: {{ $apiNamespace }}
spec:
  selector:
    app: cellbox-api
  ports:
    - name: http
      port: 8090
      targetPort: http
{{- end }}
