{{- if and .Values.api.enabled .Values.api.volumeBackups.password }}
{{- $secret := include "cellbox.backupPasswordSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  namespace: {{ include "cellbox.apiNamespace" . }}
type: Opaque
stringData:
  {{ .Values.api.volumeBackups.passwordKey }}: {{ .Values.api.volumeBackups.password | quote }}
{{- end }}
