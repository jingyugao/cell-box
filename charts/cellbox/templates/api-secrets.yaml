{{- if and .Values.api.enabled .Values.api.manageSecrets }}
{{- $namespace := include "cellbox.apiNamespace" . }}
{{- $defaults := dict "listen" "0.0.0.0:8090" "dataDir" "/var/lib/cellbox" "publicUrl" (printf "http://cellbox-api.%s.svc.cluster.local:8090" $namespace) "clients" (list (dict "id" "default" "tokenEnv" "CELLBOX_CLIENT_TOKEN")) "profiles" (list) }}
{{- $config := mergeOverwrite $defaults (deepCopy .Values.api.config) }}
{{- $existing := lookup "v1" "Secret" $namespace .Values.api.clientTokensSecret }}
{{- $tokens := dict }}
{{- $used := dict }}
{{- range $client := $config.clients }}
{{- $key := required "each API client requires tokenEnv" $client.tokenEnv }}
{{- if not (regexMatch "^[A-Za-z_][A-Za-z0-9_]*$" $key) }}
{{- fail "client tokenEnv must be an environment variable name" }}
{{- end }}
{{- $token := get $.Values.api.clientTokens $key }}
{{- if and (not $token) $existing }}
{{- $token = (get (default (dict) $existing.data) $key | b64dec) }}
{{- end }}
{{- if not $token }}{{- $token = randAlphaNum 48 }}{{- end }}
{{- if or (lt (len $token) 32) (hasKey $used $token) (hasKey $tokens $key) }}
{{- fail "client tokens must be distinct, have distinct tokenEnv names, and be at least 32 bytes" }}
{{- end }}
{{- $_ := set $used $token true }}
{{- $_ := set $tokens $key ($token | b64enc) }}
{{- end }}
{{- if not $tokens }}{{- fail "at least one API client is required" }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.api.configSecret }}
  namespace: {{ $namespace }}
type: Opaque
data:
  config.json: {{ toJson $config | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.api.clientTokensSecret }}
  namespace: {{ $namespace }}
type: Opaque
data:
  {{- toYaml $tokens | nindent 2 }}
{{- end }}
