{{- if and .Values.api.enabled .Values.api.manageSecrets }}
{{- $namespace := include "cellbox.apiNamespace" . }}
{{- $defaults := dict "listen" "0.0.0.0:8090" "dataDir" "/var/lib/cellbox" "publicUrl" (printf "http://cellbox-api.%s.svc.cluster.local:8090" $namespace) "profiles" (list) }}
{{- $config := mergeOverwrite $defaults (deepCopy .Values.api.config) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.api.configSecret }}
  namespace: {{ $namespace }}
type: Opaque
data:
  config.json: {{ toJson $config | b64enc | quote }}
{{- end }}
