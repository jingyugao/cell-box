{{- if and .Values.api.enabled .Values.api.manageSecrets }}
{{- $namespace := include "cellbox.apiNamespace" . }}
{{- $defaults := dict "listen" "0.0.0.0:8090" "dataDir" "/var/lib/cellbox-data" "profiles" (list) "volumeBackups" (dict "binary" "restic" "keepLast" 3) }}
{{- $config := mergeOverwrite $defaults (deepCopy .Values.api.config) }}
{{- if include "cellbox.backupPasswordSecret" . }}
{{- $backups := get $config "volumeBackups" | default dict }}
{{- $_ := set $backups "passwordEnv" "CELLBOX_BACKUP_PASSWORD" }}
{{- $_ := set $config "volumeBackups" $backups }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.api.configSecret }}
  namespace: {{ $namespace }}
type: Opaque
data:
  config.json: {{ toJson $config | b64enc | quote }}
{{- end }}
