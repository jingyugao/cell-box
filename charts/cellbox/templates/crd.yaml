{{- if .Values.crd.create }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cellboxes.cellbox.local
  annotations:
    helm.sh/resource-policy: keep
spec:
  group: cellbox.local
  scope: Namespaced
  names:
    kind: Cellbox
    plural: cellboxes
    singular: cellbox
    shortNames: [cb]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Desired
          type: string
          jsonPath: .spec.desiredState
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Node
          type: string
          jsonPath: .spec.nodeName
        - name: Pod
          type: string
          jsonPath: .status.podName
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [nodeName, container]
              x-kubernetes-validations:
                - rule: "(has(self.persistentHome) && self.persistentHome) == (has(oldSelf.persistentHome) && oldSelf.persistentHome)"
                  message: persistentHome is immutable
                - rule: "(has(self.homeVolumeUID) ? self.homeVolumeUID : '') == (has(oldSelf.homeVolumeUID) ? oldSelf.homeVolumeUID : '')"
                  message: homeVolumeUID is immutable
                - rule: "(has(self.mounts) ? self.mounts : []) == (has(oldSelf.mounts) ? oldSelf.mounts : [])"
                  message: mounts are immutable
                - rule: "(has(self.transitionID) ? self.transitionID : '') != (has(oldSelf.transitionID) ? oldSelf.transitionID : '') || (has(self.waitPorts) ? self.waitPorts : []) == (has(oldSelf.waitPorts) ? oldSelf.waitPorts : [])"
                  message: waitPorts can change only with a new transitionID
              properties:
                nodeName:
                  type: string
                  minLength: 1
                  maxLength: 63
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: nodeName is immutable
                desiredState:
                  type: string
                  enum: [Running, Suspended]
                  default: Running
                transitionID:
                  type: string
                  maxLength: 200
                waitPorts:
                  type: array
                  x-kubernetes-list-type: set
                  minItems: 1
                  maxItems: 64
                  items:
                    type: integer
                    minimum: 1
                    maximum: 65535
                sharedReadOnlyHostPath:
                  type: string
                  minLength: 2
                  maxLength: 4096
                  pattern: '^/.*$'
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: sharedReadOnlyHostPath is immutable
                debugReadOnlyHostPath:
                  type: string
                  minLength: 2
                  maxLength: 4096
                  pattern: '^/.*$'
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: debugReadOnlyHostPath is immutable
                debugReadWriteHostPath:
                  type: string
                  minLength: 2
                  maxLength: 4096
                  pattern: '^/.*$'
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: debugReadWriteHostPath is immutable
                persistentHome:
                  type: boolean
                homeVolumeUID:
                  type: string
                  maxLength: 128
                  pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
                mounts:
                  type: array
                  minItems: 1
                  x-kubernetes-list-type: atomic
                  items:
                    type: object
                    required: [uid, mountPath]
                    properties:
                      uid:
                        type: string
                        maxLength: 128
                        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
                      mountPath:
                        type: string
                        minLength: 2
                        maxLength: 4096
                        pattern: '^/.*$'
                      readOnly:
                        type: boolean
                retryNonce:
                  type: string
                  maxLength: 128
                startupTimeoutSeconds:
                  type: integer
                  format: int64
                  minimum: 10
                  maximum: 600
                  default: 90
                container:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  required: [name, image, imagePullPolicy]
                  properties:
                    name:
                      type: string
                      minLength: 1
                    image:
                      type: string
                      minLength: 1
                    imagePullPolicy:
                      type: string
                      enum: [Never, IfNotPresent]
                servicePorts:
                  type: array
                  maxItems: 16
                  items:
                    type: object
                    required: [port]
                    properties:
                      name:
                        type: string
                      port:
                        type: integer
                        minimum: 1
                        maximum: 65535
                      targetPort:
                        x-kubernetes-int-or-string: true
                        anyOf:
                          - type: integer
                          - type: string
                      protocol:
                        type: string
                        enum: [TCP, UDP, SCTP]
                        default: TCP
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
{{- end }}
