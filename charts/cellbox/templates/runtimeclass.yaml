{{- if .Values.runtimeClass.create }}
{{- $runtimeClass := .Values.runtimeClass | default dict }}
{{- $runtimeClassName := get $runtimeClass "name" | default "runsc-recoverable" | toString | trim }}
{{- $runtimeHandler := get $runtimeClass "handler" | default "" | toString | trim }}
{{- if eq $runtimeHandler "" }}{{- $runtimeHandler = $runtimeClassName }}{{- end }}
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: {{ $runtimeClassName | quote }}
  annotations:
    helm.sh/resource-policy: keep
handler: {{ $runtimeHandler | quote }}
{{- end }}
