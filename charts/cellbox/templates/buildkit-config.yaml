{{- if and .Values.api.enabled .Values.buildkit.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: cellbox-buildkit-config
  namespace: {{ include "cellbox.apiNamespace" . }}
data:
  buildkitd.toml: |
    [worker.oci]
      snapshotter = {{ .Values.buildkit.snapshotter | quote }}
      gc = true
      reservedSpace = {{ .Values.buildkit.gc.reservedSpace | quote }}
      maxUsedSpace = {{ .Values.buildkit.gc.maxUsedSpace | quote }}
      minFreeSpace = {{ .Values.buildkit.gc.minFreeSpace | quote }}
    {{- if .Values.buildkit.registryHost }}
    [registry.{{ .Values.buildkit.registryHost | quote }}]
      http = {{ .Values.buildkit.registryHTTP }}
    {{- else }}
    # BuildKit uses the normal registry TLS settings.
    {{- end }}
{{- end }}
