{{- if .Values.api.enabled }}
{{- $apiNamespace := include "cellbox.apiNamespace" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cellbox-server
  namespace: {{ $apiNamespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cellbox-server
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [cellbox.jingyugao.github.io]
    resources: [cellboxes]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [cellbox.jingyugao.github.io]
    resources: [cellboxes/status, cellboxes/finalizers]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [pods, services]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch, create, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cellbox-server
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: cellbox-server
    namespace: {{ $apiNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cellbox-server
{{- end }}
