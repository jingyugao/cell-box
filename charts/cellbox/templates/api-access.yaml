{{- if .Values.api.enabled }}
{{- $apiNamespace := include "cellbox.apiNamespace" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cellbox-api
  namespace: {{ $apiNamespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cellbox-api
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [cellbox.local]
    resources: [cellboxes]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods, services]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cellbox-api
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: cellbox-api
    namespace: {{ $apiNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cellbox-api
{{- end }}
