# Registry for relative image names; fully qualified references take precedence.
imageRegistry: docker.io

# Use the same S3-compatible service/bucket as CoCell with a separate prefix.
# Credentials remain in an existing Secret (present in each workload namespace).
objectStorage:
  endpoint: ""
  bucket: ""
  region: us-east-1
  prefix: cellbox
  pathStyle: true
  credentialsSecret: ""
  accessKeyKey: OSS_ACCESS_KEY
  secretKeyKey: OSS_SECRET_KEY


crd:
  create: true
runtimeClass:
  create: true
controller:
  enabled: true
  image: gaojingyu628/cellbox-controller@sha256:519e622384ffc1227847ec30b575343ba80552a18036c6d13be31cf259ec422e
  imagePullPolicy: IfNotPresent
  name: cellbox-controller
  serviceAccountName: cellbox-controller
  criDirectory: /run/containerd
  criSocket: /run/containerd/containerd.sock
  # Provision gVisor, the wrapper, and runtime configuration manually on each node.
  nodeSelector:
    kubernetes.io/os: linux
    kubernetes.io/arch: amd64
  tolerations: []

api:
  enabled: true
  namespace: ""
  image: gaojingyu628/cellbox-api@sha256:37cec04f62d63b4c43a1366cf24394713c73f8e111a7da751dfbe327510fdf2c
  initImage: docker.io/library/busybox:1.36
  imagePullPolicy: IfNotPresent
  # Exactly one active API; a Kubernetes Lease fences process replacement.
  replicas: 1
  # Additional container environment variables, e.g. HTTPS_PROXY and NO_PROXY.
  extraEnv: []
  nodeSelector: {}
  configSecret: cellbox-api-config
  # Set false to use the existing configSecret.
  manageSecrets: true
  # Overrides for the API JSON configuration; defaults start with no profiles.
  config: {}
  # Temporary archive staging only; durable content is stored in S3.
  temporaryStorageSize: 4Gi

buildkit:
  enabled: false
  extraEnv: []
  image: docker.io/moby/buildkit:v0.33.0-rootless
  imagePullPolicy: IfNotPresent
  repository: ""
  registryHost: ""
  registryHTTP: false
  # Optional kubernetes.io/dockerconfigjson Secret used by the API/buildctl client.
  registryCredentialsSecret: ""
  # Require overlayfs rather than silently falling back to full-copy snapshots.
  snapshotter: overlayfs
  cacheSize: 10Gi
  gc:
    reservedSpace: 512MB
    maxUsedSpace: 8GB
    minFreeSpace: 4GB
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi
