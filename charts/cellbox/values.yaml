# Registry for relative image names; fully qualified references take precedence.
imageRegistry: docker.io

# Use the same S3-compatible service/bucket as CoCell with a separate prefix.
# Credentials remain in an existing Secret (present in each workload namespace).
objectStorage:
  endpoint: ""
  bucket: ""
  region: us-east-1
  prefix: cellbox
  pathStyle: true
  credentialsSecret: ""
  accessKeyKey: OSS_ACCESS_KEY
  secretKeyKey: OSS_SECRET_KEY


crd:
  create: true
runtimeClass:
  create: true
# One durable local directory for SQLite metadata, build logs, and archive download validation temps.
# It is mounted on the single node selected by server.nodeName.
storage:
  hostPath: /var/lib/cellbox-data
  # Optionally reuse an existing PVC instead of hostPath storage.
  existingClaim: ""
server:
  # The combined API and node runtime is pinned to this one machine.
  nodeName: ""
  image: gaojingyu628/cellbox-server:0.1.0
  imagePullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 1Gi
controller:
  # Shared across compatible container specs, plus one slot during rotation.
  warmPoolSize: 2
  # Optional OTLP exporter configuration, same protocol as the API.
  extraEnv: []
  criDirectory: /run/containerd
  criSocket: /run/containerd/containerd.sock
  # Provision gVisor, the wrapper, and runtime configuration manually on each node.
  nodeSelector:
    kubernetes.io/os: linux
    kubernetes.io/arch: amd64
  tolerations: []

api:
  enabled: true
  namespace: ""
  initImage: docker.io/library/busybox:1.36
  # Exactly one active API; a Kubernetes Lease fences process replacement.
  replicas: 1
  # Additional container environment variables, e.g. HTTPS_PROXY and NO_PROXY.
  extraEnv: []
  nodeSelector: {}
  configSecret: cellbox-api-config
  # Set false to use the existing configSecret.
  manageSecrets: true
  # Overrides for the API JSON configuration; defaults start with no profiles.
  config: {}
buildkit:
  enabled: false
  extraEnv: []
  image: docker.io/moby/buildkit:v0.33.0-rootless
  imagePullPolicy: IfNotPresent
  repository: ""
  registryHost: ""
  registryHTTP: false
  # Optional kubernetes.io/dockerconfigjson Secret used by the API/buildctl client.
  registryCredentialsSecret: ""
  # Require overlayfs rather than silently falling back to full-copy snapshots.
  snapshotter: overlayfs
  cacheSize: 10Gi
  gc:
    reservedSpace: 512MB
    maxUsedSpace: 8GB
    minFreeSpace: 4GB
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi
