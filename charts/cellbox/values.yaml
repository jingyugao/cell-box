controller:
  image: docker.io/gaojingyu628/cellbox-controller@sha256:f31ff1bb57f108318b08e0f2048dd635dfbd7a9ba87bb7a4557c4f8df1cb6c87
  adapterImage: docker.io/gaojingyu628/cellbox-controller@sha256:f31ff1bb57f108318b08e0f2048dd635dfbd7a9ba87bb7a4557c4f8df1cb6c87
  imagePullPolicy: IfNotPresent
  name: cellbox-controller
  serviceAccountName: cellbox-controller
  criDirectory: /run/containerd
  criSocket: /run/containerd/containerd.sock
  # Install through Kubernetes on systemd-managed Linux/containerd nodes.
  # Set enabled=false when the node runtime is provisioned externally.
  runtimeInstaller:
    enabled: true
    mode: auto
    containerdConfig: ""
    service: ""
    platform: systrap
    command: []
    gvisor:
      enabled: true
      version: "20260914.0"
      releaseURL: https://storage.googleapis.com/gvisor/releases/release
  nodeSelector:
    kubernetes.io/os: linux
    kubernetes.io/arch: amd64
  tolerations: []

api:
  enabled: true
  namespace: cell-box
  image: docker.io/gaojingyu628/cellbox-api@sha256:689557f6ad817647e590498a0718e73d272597e9b7e71dfb76f96c9a4d637e0b
  imagePullPolicy: IfNotPresent
  replicas: 1
  nodeSelector: {}
  configSecret: cellbox-api-config
  clientTokensSecret: cellbox-api-client-tokens
  ossCredentialsSecret: cellbox-oss-credentials
  dataClaim: cellbox-api-data
  storageClassName: ""
  storageSize: 10Gi

buildkit:
  enabled: false
  image: moby/buildkit:v0.33.0-rootless
  imagePullPolicy: IfNotPresent
  repository: ""
  registryHost: ""
  registryHTTP: false
  # Require overlayfs rather than silently falling back to full-copy snapshots.
  snapshotter: overlayfs
  cacheSize: 10Gi
  gc:
    reservedSpace: 512MB
    maxUsedSpace: 8GB
    minFreeSpace: 4GB
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi
