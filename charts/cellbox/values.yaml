controller:
  image: docker.io/gaojingyu628/cellbox-controller@sha256:4eb9afdecf8e88fc552693685a6699a4a9e2a4e0458d30d15c5e83035eadf4d3
  adapterImage: docker.io/gaojingyu628/cellbox-controller@sha256:4eb9afdecf8e88fc552693685a6699a4a9e2a4e0458d30d15c5e83035eadf4d3
  imagePullPolicy: IfNotPresent
  name: cellbox-controller
  serviceAccountName: cellbox-controller
  criDirectory: /run/containerd
  criSocket: /run/containerd/containerd.sock
  # Generic Kubernetes nodes must have gVisor and the Cellbox runtime handler
  # configured. Enable an installer only for a supported node environment.
  runtimeInstaller:
    enabled: false
    command: []
  nodeSelector: {}
  tolerations: []

api:
  enabled: true
  namespace: cell-box
  image: docker.io/gaojingyu628/cellbox-api@sha256:689557f6ad817647e590498a0718e73d272597e9b7e71dfb76f96c9a4d637e0b
  imagePullPolicy: IfNotPresent
  replicas: 1
  nodeSelector: {}
  configSecret: cellbox-api-config
  clientTokensSecret: cellbox-api-client-tokens
  ossCredentialsSecret: cellbox-oss-credentials
  dataClaim: cellbox-api-data
  storageClassName: ""
  storageSize: 10Gi

buildkit:
  enabled: false
  image: moby/buildkit:v0.33.0-rootless
  imagePullPolicy: IfNotPresent
  repository: ""
  registryHost: ""
  registryHTTP: false
  # Require overlayfs rather than silently falling back to full-copy snapshots.
  snapshotter: overlayfs
  cacheSize: 10Gi
  gc:
    reservedSpace: 512MB
    maxUsedSpace: 8GB
    minFreeSpace: 4GB
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi
