controller:
  image: docker.io/gaojingyu628/cellbox-controller@sha256:0a5ba6afc1dce586cd7d2af94d845507013c148c7edd4938249371819d18cd90
  adapterImage: docker.io/gaojingyu628/cellbox-controller@sha256:0a5ba6afc1dce586cd7d2af94d845507013c148c7edd4938249371819d18cd90
  imagePullPolicy: IfNotPresent
  name: cellbox-controller
  serviceAccountName: cellbox-controller
  criDirectory: /run/k3s/containerd
  nodeSelector: {}
  tolerations: []

api:
  enabled: false
  namespace: cell-box
  image: docker.io/gaojingyu628/cellbox-api@sha256:689557f6ad817647e590498a0718e73d272597e9b7e71dfb76f96c9a4d637e0b
  imagePullPolicy: IfNotPresent
  replicas: 1
  nodeSelector: {}
  configSecret: cellbox-api-config
  clientTokensSecret: cellbox-api-client-tokens
  ossCredentialsSecret: cellbox-oss-credentials
  dataClaim: cellbox-api-data
  storageClassName: ""
  storageSize: 10Gi

buildkit:
  enabled: false
  image: moby/buildkit:v0.33.0-rootless
  imagePullPolicy: IfNotPresent
  repository: ""
  registryHost: ""
  registryHTTP: false
  # Require overlayfs rather than silently falling back to full-copy snapshots.
  snapshotter: overlayfs
  cacheSize: 10Gi
  gc:
    reservedSpace: 512MB
    maxUsedSpace: 8GB
    minFreeSpace: 4GB
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

gatewayAccess:
  enabled: false
  serviceAccountName: cellbox-gateway
  namespace: cell-box
  image: cellbox-gateway:v0.1.0
  imagePullPolicy: IfNotPresent
  replicas: 0
  args:
    - --namespace=cell-box
