apiVersion: v1
kind: Namespace
metadata:
  name: cellbox-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cellbox-controller
  namespace: cellbox-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cellbox-controller-k8s
  namespace: cell-box
subjects:
  - kind: ServiceAccount
    name: cellbox-controller
    namespace: cellbox-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cellbox-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cellbox-controller
  namespace: cellbox-system
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: ['']
    resources: [events]
    verbs: [get, list, watch, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cellbox-controller
  namespace: cellbox-system
subjects:
  - kind: ServiceAccount
    name: cellbox-controller
    namespace: cellbox-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cellbox-controller
